<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rain org health</title>
<!--
  There is no overview page: its tiles restated counts the other pages already
  show, and its audit alarm duplicated the one on audit.html. Dropping it cannot
  drop index.html, because GitHub Pages serves that as the site root — so the
  root forwards to Repositories, the scanner's own output and the reason this
  dashboard exists.

  A redirect rather than moving the Repositories page here: repositories.html
  keeps working for anything already linking to it, and the page stays where its
  tests bind it by filename.
-->
<meta http-equiv="refresh" content="0; url=repositories.html" />
<link rel="canonical" href="repositories.html" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    background: #fdfcfb; color: #201d1a;
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14120f; color: #f0ece6; }
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 48px 20px; }
  a { color: #2563eb; }
  @media (prefers-color-scheme: dark) { a { color: #7ba7ff; } }
</style>
</head>
<body>
<div class="wrap">
  <p>Redirecting to <a href="repositories.html">Repositories</a>…</p>
</div>
</body>
</html>
