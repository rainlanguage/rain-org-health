        const tail = el("div", "own-prov");
        tail.append(el("span", "own-chip own-chip-yes", "approved"));
        if (d.expectedAs) {
          tail.append(el("span", "own-chip own-chip-yes", REG_EXPECTED[d.expectedAs]));
        } else {
          const tag = el("span", "rbac-tag rbac-tag-unexpected reg-stray", "not Safe or timelock");
          tag.title = "Neither a TOKEN_OWNER_SAFE nor a GOVERNANCE_TIMELOCK in this index.";
          tail.append(tag);
        }
        if (typeof d.approvedAtTimestamp === "number") tail.append(el("span", "own-note", utc(d.approvedAtTimestamp)));
        row.append(scopeNode(d.scope, d.unscoped === true), ac, tail);
        return row;
      },
    );
    if (n.expectedCount === 0) {
      slot.append(
        el("div", "own-note rbac-ideal-gap", "The index holds no token-owner Safe or governance timelock on this network, so no delegate is recognised."),
      );
    }
    section(
      `Delegation changes — ${n.changes.length}, newest first`,
      n.changes,
      "No delegate has ever been approved or revoked in either registry.",
      (c) => {
        const d = c.registryDelegate || {};
        const row = el("div", "own-row");
        const ac = el("div", "bcn-detail");
        ac.append(
          line("in", el("span", "own-note", regKind(d.registry && d.registry.kind))),
          line("approver", whoNode(String(d.account), chain, pins)),
          line("delegate", whoNode(String(d.delegate), chain, pins)),
        );
        if (typeof c.transactionFrom === "string" && c.transactionFrom.toLowerCase() !== String(d.account).toLowerCase()) {
          ac.append(line("sent by", whoNode(c.transactionFrom, chain, pins)));
        }
        const tail = el("div", "own-prov");
        tail.append(
          el("span", `own-chip own-chip-${c.approved === true ? "yes" : "no"}`, c.approved === true ? "approved" : "revoked"),
          el("span", "own-note", utc(c.blockTimestamp)),
          txNode(c.transactionHash, chain),
        );
        row.append(scopeNode(d.scope, d.unscoped === true), ac, tail);
        return row;
      },
    );
    const nowSecs = Math.floor(io.now() / 1000);
    const age = (ts) => (typeof ts !== "number" ? "age unknown" : ts > nowSecs ? "ahead of this browser's clock" : `${span(nowSecs - ts)} ago`);
    const bindKey = (b) => {
      const label = regLabel(labels, b.name);
      return label ? "0" + label : "1" + regLow(b.name);
    };
    section(
      `Config bindings — ${n.bindings.length}`,
      n.bindings.slice().sort((a, b) => bindKey(a).localeCompare(bindKey(b))),
      "Nothing is bound in the ConfigRegistry.",
      (b) => {
        const row = el("div", "own-row reg-binding");
        const ac = el("div", "bcn-detail");
        ac.append(line("authority", whoNode(String(b.authority), chain, pins)), line("value", valueNode(b.value, b.valueType)));
        if (typeof b.sender === "string" && b.sender.toLowerCase() !== String(b.authority).toLowerCase()) {
          ac.append(line("bound by", whoNode(b.sender, chain, pins)));
        }
        const tail = el("div", "own-prov");
        tail.append(
          el("span", "own-note reg-age", age(b.boundAtTimestamp)),
          el("span", "own-note", `block ${b.boundAtBlock ?? "?"} · ${utc(b.boundAtTimestamp)}`),
        );
        if (typeof b.registerCount === "number" && b.registerCount > 1) {
          tail.append(el("span", "own-note", `${b.registerCount} writes`));
        }
        row.append(scopeNode(b.name), ac, tail);
        return row;
      },
    );
    section(
      `Config changes — ${n.registers.length}, newest first`,
      n.registers,
      "No value has ever been bound in the ConfigRegistry.",
      (c) => {
        const b = c.binding || {};
        const row = el("div", "own-row");
        const ac = el("div", "bcn-detail");
        ac.append(line("authority", whoNode(String(b.authority), chain, pins)), line("value", valueNode(c.value, c.valueType)));
        if (typeof c.sender === "string" && c.sender.toLowerCase() !== String(b.authority).toLowerCase()) {
          ac.append(line("bound by", whoNode(c.sender, chain, pins)));
        }
        const tail = el("div", "own-prov");
        tail.append(el("span", "own-note", utc(c.blockTimestamp)), txNode(c.transactionHash, chain));
        row.append(scopeNode(b.name), ac, tail);
        return row;
      },
    );
    slot.append(el("div", "own-grouphead", `Migration lines — ${n.lines.length}`));
    if (n.lines.length === 0) slot.append(el("div", "rbac-empty", "No migration has been recorded in the MigrationRegistry."));
    const word = (v) => el("span", "own-note", regLabel(labels, v) || String(v));
    for (const l of n.lines) {
      const head = el("div", "bcn-detail reg-line");
      const chip = el(
        "span",
        `own-chip own-chip-${l.chain === "intact" ? "yes" : "no"}`,
        `${l.records.length} record${l.records.length === 1 ? "" : "s"}, chain ${l.chain}`,
      );
      head.append(
        line("namespace", word(l.namespace)),
        line("writer", whoNode(String(l.writer), chain, pins)),
        line("head", l.head === null ? el("span", "own-note", "not read") : word(l.head), chip),
      );
      if (l.records.length === 0 && n.genesis !== null && regLow(l.head) === n.genesis) {
        head.append(el("div", "own-note rbac-ideal-gap", "At genesis on this registry: its history is not yet backfilled."));
      }
      if (l.behind) {
        head.append(
          el("div", "own-note rbac-ideal-gap", `subgraph behind the scan (indexed to block ${n.indexedBlock}, head read at block ${l.headBlock})`),
        );
      }
      if (l.chain === "unchecked") head.append(el("div", "own-note rbac-ideal-gap", "The scan carries no migration genesis to check the first record against."));
      for (const p of l.problems) head.append(el("div", "own-note rbac-ideal-off reg-problem", p));
      slot.append(head);
      const table = el("div", "own-table");
      for (const m of l.records) {
        const row = el("div", m.problems.length ? "own-row reg-record rbac-off" : "own-row reg-record");
        const ac = el("div", "bcn-detail");
        ac.append(line("applied onto", word(m.appliedOnto)));
        for (const p of m.problems) ac.append(el("div", "rbac-unknown reg-problem", p));
        if (typeof m.sender === "string" && m.sender.toLowerCase() !== String(l.writer).toLowerCase()) {
          ac.append(line("recorded by", whoNode(m.sender, chain, pins)));
        }
        const tail = el("div", "own-prov");
        tail.append(
          el("span", "own-note reg-index", `#${m.index ?? "?"}`),
          el("span", "own-note", `applied ${utc(m.appliedAt)}`),
          txNode(m.transactionHash, chain),
        );
        row.append(scopeNode(m.migration), ac, tail);
        table.append(row);
      }
      if (l.records.length) slot.append(table);
    }
  };
  // Builds the Root registry tab and starts one live read per network.
  // Returns a promise that settles once every network has rendered.
  const renderRegistry = (r, migrations) => {
    sink.append(el("h2", null, "Root registry — delegations and config changes, per network"));
    const off = (why) => {
      sink.append(el("div", "rbac-empty", `Registry history unavailable — ${why}.`));
      return Promise.resolve();
    };
    if (!r || typeof r !== "object") return off("this scan carries no subgraph location");
    if (typeof r.unavailable === "string") return off(`the scan ${r.unavailable}`);
    const sub = el("div", "own-sub");
    sub.append("Read live from ");
    sub.append(link("", `${r.org}/${r.repo}`, `https://github.com/${r.org}/${r.repo}/tree/main/subgraph`));
    sub.append(
      `'s subgraph as this page loads, at its "${r.tag}" tag: every delegate approval in the ConfigRegistry and ` +
        "MigrationRegistry, every config binding and the writes behind it, and every migration line, checked record by record. Names, " +
        "scopes and migrations are labelled where the deploy repo spells out the hash's preimage, and shown as the raw hash otherwise.",
    );
    sink.append(sub);
    const nets = Array.isArray(r.networks) ? r.networks : [];
    if (nets.length === 0) return off("the subgraph declares no networks");
    const labels = {};
    for (const src of [r.registryNames, r.roleNames]) {
      if (!src || typeof src !== "object") continue;
      for (const [k, v] of Object.entries(src)) {
        if (typeof v === "string" && !Object.prototype.hasOwnProperty.call(labels, k.toLowerCase())) labels[k.toLowerCase()] = v;
      }
    }
    const g = migrations && typeof migrations === "object" ? migrations.genesis : null;
    const genesis = typeof g === "string" && /^0x[0-9a-fA-F]{64}$/.test(g) ? g.toLowerCase() : null;
    if (genesis !== null) labels[genesis] = "genesis";
    const pinTable = r.addressNames && typeof r.addressNames === "object" ? r.addressNames : null;
    const cr = r.configRegistries && typeof r.configRegistries === "object" ? r.configRegistries : {};
    const configBy = new Map(Object.entries(cr).filter(([, a]) => typeof a === "string").map(([k, a]) => [k, a.toLowerCase()]));
    const declaredBy = new Map();
    const headsBy = new Map();
    for (const m of migrations && Array.isArray(migrations.networks) ? migrations.networks : []) {
      if (m && typeof m.network === "string" && typeof m.registry === "string") declaredBy.set(m.network, m.registry.toLowerCase());
      if (m && typeof m.network === "string" && Array.isArray(m.lines)) {
        const heads = new Map();
        for (const h of m.lines) {
          if (h && typeof h.writer === "string" && typeof h.namespace === "string") {
            heads.set(regLineKey(h), {
              writer: h.writer,
              namespace: h.namespace,
              head: typeof h.head === "string" ? h.head : null,
              block: typeof h.headBlock === "number" ? h.headBlock : null,
            });
          }
        }
        headsBy.set(m.network, heads);
      }
    }
    const reads = [];
    for (const n of nets) {
      if (!n || typeof n !== "object") continue;
      const chain = typeof n.chain === "string" ? n.chain : null;
      const title = chain && chain !== n.network ? `${chain} (${n.network})` : String(n.network);
      sink.append(el("h3", "tok-h3", title));
      const slot = el("div", "rbac-net");
      sink.append(slot);
      const t = pinTable && chain && Object.prototype.hasOwnProperty.call(pinTable, chain) ? pinTable[chain] : null;
      const pins = pinTable ? (t && typeof t === "object" ? t : {}) : null;
      const endpoint = typeof n.endpoint === "string" && n.endpoint.startsWith("https://") ? n.endpoint : null;
      const published = `${r.subgraph}-${n.network}/${r.tag}`;
      if (!endpoint) {
        regBody(slot, { state: "error", detail: "the scan gave no https endpoint for this network" }, chain, null, published, pins, labels);
        continue;
      }
      regBody(slot, { state: "loading" }, chain, endpoint, published, pins, labels);
      reads.push(
        regRead(endpoint, genesis, declaredBy.get(chain) ?? null, configBy.get(n.network) ?? null, headsBy.get(chain) ?? new Map()).then((res) =>
          regBody(slot, res, chain, endpoint, published, pins, labels),
        ),
      );
    }
    return Promise.all(reads);
  };
  const MIG_STATES = {
    applied: ["applied", "yes"],
    notApplied: ["pending", "roll"],
    notRecorded: ["not recorded", "roll"],
    unregistered: ["no registry record", "no"],
    unknown: ["unknown", "dim"],
  };
  const MIG_OWED = ["notApplied", "notRecorded"];
  const renderMigrations = (v) => {
    sink.append(el("h2", null, "Migrations — run or not, per network"));
    if (!v || typeof v !== "object" || !Array.isArray(v.networks) || v.networks.length === 0) {
      const why =
        v && typeof v.unavailable === "string" ? v.unavailable : "the scan produced no migration data";
      sink.append(el("div", "mig-empty", `Migrations unavailable — ${why}.`));
      return;
    }
    const str = (s) => (typeof s === "string" && s ? s : null);
    const repo = str(v.org) && str(v.repo) ? `${v.org}/${v.repo}` : null;
    const sub = el("div", "own-sub");
    sub.append("Every migration in ");
    if (repo && str(v.path)) {
      sub.append(link("", `${repo}'s ${v.path}`, `https://github.com/${repo}/blob/HEAD/${v.path}`));
    } else {
      sub.append("the deploy repo's migrations file");
    }
    sub.append(
      ", with its state read from each network's MigrationRegistry appliedV5(writer, namespace, id) at scan time. " +
        'Every migration the file declares for a network is required there: "pending" means its record is not ' +
        'in that registry yet. "Not recorded" means the file says it ran (and gives when) but the registry holds no record for it, ' +
        "so the record is still owed. Both are warnings. " +
        '"No registry record" is an error: the script writes no record, so it is in no line and its run state ' +
        'cannot be read or ordered. "Unknown" means the registry read did not answer, never that it has not run.',
    );
    sink.append(sub);
    const nets = v.networks
      .filter((n) => n && typeof n === "object")
      .map((n) => ({
        n,
        network: str(n.network) || "unnamed network",
        rows: (Array.isArray(n.migrations) ? n.migrations : []).filter(
          (m) => m && typeof m === "object" && str(m.script),
        ),
      }));
    const owed = (rows) => rows.filter((m) => MIG_OWED.includes(m.state)).length;
    const unread = (rows) => rows.filter((m) => m.state === "unknown").length;
    const banner = (pending, unknown, where) => {
      const cls = pending > 0 ? "own-verify-roll" : unknown > 0 ? "own-verify-down" : "own-verify-ok";
      const b = el("div", `own-verify ${cls} mig-banner`);
      b.append(
        el(
          "span",
          "own-verify-msg",
          pending > 0
            ? `${pending} required migration${pending === 1 ? "" : "s"} pending ${where}`
            : unknown > 0
            ? `Nothing known pending ${where}, but ${unknown} could not be read`
            : `Every declared migration is applied ${where}`,
        ),
      );
      if (pending > 0 && unknown > 0) b.append(el("span", "own-verify-src", `${unknown} more could not be read`));
      return b;
    };
    const top = banner(
      nets.reduce((a, x) => a + owed(x.rows), 0),
      nets.reduce((a, x) => a + unread(x.rows), 0),
      "across every network",
    );
    const pendingOn = nets.filter((x) => owed(x.rows) > 0).map((x) => `${x.network} ${owed(x.rows)}`);
    if (pendingOn.length) top.append(el("span", "own-verify-src", pendingOn.join(" · ")));
    sink.append(top);
    const chip = (state) => {
      const [text, cls] = MIG_STATES[state] || [`unrecognised state ${String(state)}`, "dim"];
      return el("span", `own-chip own-chip-${cls}`, text);
    };
    const scriptNode = (script, cls) => {
      const name = script.replace(/^.*\//, "");
      return repo ? link(cls, name, `https://github.com/${repo}/blob/HEAD/${script}`) : el("span", cls, name);
    };
    for (const { n, network, rows } of nets) {
      const count = (s) => rows.filter((m) => m.state === s).length;
      sink.append(
        el(
          "h3",
          "tok-h3",
          `${network} — ${count("applied")} applied, ${count("notApplied")} pending, ` +
            `${count("notRecorded")} not recorded, ${count("unknown")} unknown, ` +
            `${count("unregistered")} with no registry record`,
        ),
      );
      const where = el("div", "own-groupnote");
      if (str(n.registry)) {
        where.append("registry ", addrNode("own-addr", n.registry, network));
      }
      if (str(n.rpcHost)) {
        where.append(` · via ${n.rpcHost}`);
      } else {
        where.append(" · this scan has no RPC endpoint for this network, so nothing here was read");
      }
      if (typeof n.unread === "number" && n.unread > 0) {
        where.append(` · ${n.unread} registry read${n.unread === 1 ? "" : "s"} unanswered`);
      }
      sink.append(where, banner(owed(rows), unread(rows), `on ${network}`));
      const table = el("div", "own-table");
      for (const m of rows) {
        const row = el("div", `own-row mig-${m.state}`);
        const rc = el("div", "own-rc");
        rc.append(scriptNode(m.script, "own-role"));
        if (str(m.id)) {
          rc.append(el("div", "mig-hash", `id ${m.id}`));
          if (str(m.namespace)) rc.append(el("div", "mig-hash", `namespace ${m.namespace}`));
        }
        const ac = el("div", "bcn-detail");
        if (str(m.writer)) {
          const line = el("div", "bcn-line");
          line.append(el("span", "bcn-key", "writer"), addrNode("own-addr", m.writer, network));
          ac.append(line);
        } else if (str(m.id)) {
          ac.append(el("div", "own-note", "the migrations file names no writer on this network"));
        } else {
          ac.append(el("div", "own-note", "error — writes no registry record, so it is in no line; its script must record one"));
        }
        for (const w of Array.isArray(m.waitsOn) ? m.waitsOn : []) {
          if (!w || typeof w !== "object") continue;
          const line = el("div", "bcn-line");
          line.append(el("span", "bcn-key", "waits on"));
          if (w.state === "genesis") {
            line.append(el("span", "own-note", "nothing — it opens its namespace's line in the registry"));
          } else {
            line.append(
              str(w.script) ? scriptNode(w.script, "mig-wait") : el("span", "mig-hash", str(w.id) || "an unnamed record"),
              chip(w.state),
            );
            if (w.state === "applied" && typeof w.appliedAt === "number") {
              line.append(el("span", "own-note", utc(w.appliedAt)));
            } else if (w.state === "notRecorded" && typeof w.executedAt === "number") {
              line.append(el("span", "own-note", `ran ${utc(w.executedAt)}`));
            }
          }
          ac.append(line);
        }
        const tail = el("div", "own-prov");
        tail.append(chip(m.state));
        if (m.state === "applied" && typeof m.appliedAt === "number") {
          tail.append(el("span", "own-note", utc(m.appliedAt)));
        } else if (m.state === "notRecorded" && typeof m.executedAt === "number") {
          tail.append(el("span", "own-note", `ran ${utc(m.executedAt)}`));
        }
        row.append(rc, ac, tail);
        table.append(row);
      }
      sink.append(table);
    }
  };
  const owners = data.deploymentOwners;
  sink.append(el("h2", null, "Known owners"));
  if (!owners || !Array.isArray(owners.groups) || owners.groups.length === 0) {
    sink.append(
      el("div", "empty", "Owner data unavailable — the scan could not read the st0x.deploy constants."),
    );
    // The grant map is parsed independently of the owner constants, so it can
    // still be readable when they are not — and it is the half of this page
    // that says who can move value.
    renderVaultOwners(data.deploymentVaultOwners);
    sink = panels.contracts;
    renderGrants(data.deploymentGrants);
    renderGrants(data.deploymentOrchestratorGrants);
    renderHealth(data.deploymentHealth);
    renderBeacons(data.deploymentBeacons);
    renderTokens(data.deploymentTokens);
    sink = panels.migrations;
    renderMigrations(data.deploymentMigrations);
    sink = panels.rbac;
    const rbacDone = renderRbac(data.deploymentRbac);
    sink = panels.registry;
    const registryDone = renderRegistry(data.deploymentRbac, data.deploymentMigrations);
    show(hashTab() || TABS[0][0]);
    return Promise.all([rbacDone, registryDone]);
  }
  const sub = el("div", "own-sub");
  sub.append("Privileged addresses read from the ");
  sub.append(
    link("", `${owners.org}/${owners.repo}`, `https://github.com/${owners.org}/${owners.repo}`),
  );
  sub.append(
    ` deploy constants — who controls production. Governed by a ${owners.threshold}-of-${owners.signerCount} Safe per chain.`,
  );
  sink.append(sub);
  for (const g of owners.groups) {
    const grp = el("div", "own-group");
    grp.append(el("div", "own-grouphead", g.title));
    if (g.note) grp.append(el("div", "own-groupnote", g.note));
    if (g.verification) grp.append(verifyBanner(g.verification));
    const table = el("div", "own-table");
    for (const e of g.entries || []) {
      const status = e.status || "active";
      const row = el("div", `own-row own-${status}`);
      const rc = el("div", "own-rc");
      rc.append(el("div", "own-role", e.role));
      if (e.note) rc.append(el("div", "own-note", e.note));
      const ac = el("div", "own-ac");
      if (e.address) {
        ac.append(addrNode("own-addr", e.address, e.network));
      } else {
        ac.append(el("span", "own-addr own-missing", "— not found"));
      }
      if (e.network) ac.append(el("span", "own-net", e.network));
      // Where a row was checked on-chain, show its two provenances side by side as
      // independent ✓/✗ per source — the declared constant and the getOwners()
      // result; otherwise a plain status pill.
      let tail;
      if (e.onChain) {
        const oc = e.onChain;
        tail = el("div", "own-prov");
        // constant source: present unless this owner was only seen on-chain.
        tail.append(
          oc === "extra"
            ? el("span", "own-chip own-chip-no", "constant ✗")
            : el("span", "own-chip own-chip-yes", "constant ✓"),
        );
        // on-chain source: present for match/extra, absent for missing, unknown
        // when the RPC didn't answer.
        tail.append(
          oc === "missing"
            ? el("span", "own-chip own-chip-no", "on-chain ✗")
            : oc === "unverified"
              ? el("span", "own-chip own-chip-dim", "on-chain —")
              : el("span", "own-chip own-chip-yes", "on-chain ✓"),
        );
      } else {
        tail = el("span", `own-status own-status-${status}`, status);
      }
      row.append(rc, ac, tail);
      table.append(row);
    }
    grp.append(table);
    sink.append(grp);
  }
  // Safe tab: who holds production, and whether it is still the Safe or has
  // moved to the governance timelock. Contracts tab: everything the Safe
  // governs rather than the Safe itself.
  renderVaultOwners(data.deploymentVaultOwners);
  sink = panels.contracts;
  renderGrants(data.deploymentGrants);
  renderGrants(data.deploymentOrchestratorGrants);
  renderHealth(data.deploymentHealth);
  renderBeacons(data.deploymentBeacons);
  renderTokens(data.deploymentTokens);
  sink = panels.migrations;
  renderMigrations(data.deploymentMigrations);
  sink = panels.rbac;
  const rbacDone = renderRbac(data.deploymentRbac);
  sink = panels.registry;
  const registryDone = renderRegistry(data.deploymentRbac, data.deploymentMigrations);
  show(hashTab() || TABS[0][0]);
  return Promise.all([rbacDone, registryDone]);
}
let data = null;
async function load() {
  try {
    const r = await fetch("health.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    $("meta").textContent = "could not load health.json";
    $("deployments").textContent = "";
    return;
  }
  const ago = Math.round((Date.now() - new Date(data.generatedAt).getTime()) / 3.6e6);
  $("meta").textContent =
    `${data.org} · scanned ${data.generatedAt.replace("T", " ").replace("Z", " UTC")}` +
    (isFinite(ago) ? ` (${ago}h ago)` : "");
  renderDeployments(document, $, data, { fetch: (url, init) => fetch(url, init), now: () => Date.now() });
}
load();
</script>
</body>
</html>
