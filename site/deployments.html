<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rain org health — deployments</title>
<style>
  :root {
    --bg: #fdfcfb; --surface: #f6f4f1; --surface-2: #eeebe6;
    --ink: #201d1a; --ink-2: #5c574f; --ink-3: #8a847a;
    --border: #e7e2da; --accent: #2563eb;
    --debt: #b45309; --debt-bg: #fef3e2; --debt-border: #f5d9ae;
    --clean: #15803d; --clean-bg: #e7f5ec;
    --crit: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --surface: #1f1d16; --surface-2: #27241b;
      --ink: #ece8e0; --ink-2: #aaa79c; --ink-3: #706c62;
      --border: #332f24; --accent: #60a5fa;
      --debt: #fbbf24; --debt-bg: #2a220f; --debt-border: #4a3c17;
      --clean: #4ade80; --clean-bg: #12241a;
      --crit: #f87171;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16150f; --surface: #1f1d16; --surface-2: #27241b;
    --ink: #ece8e0; --ink-2: #aaa79c; --ink-3: #706c62;
    --border: #332f24; --accent: #60a5fa;
    --debt: #fbbf24; --debt-bg: #2a220f; --debt-border: #4a3c17;
    --clean: #4ade80; --clean-bg: #12241a;
    --crit: #f87171;
  }
  :root[data-theme="light"] {
    --bg: #fdfcfb; --surface: #f6f4f1; --surface-2: #eeebe6;
    --ink: #201d1a; --ink-2: #5c574f; --ink-3: #8a847a;
    --border: #e7e2da; --accent: #2563eb;
    --debt: #b45309; --debt-bg: #fef3e2; --debt-border: #f5d9ae;
    --clean: #15803d; --clean-bg: #e7f5ec;
    --crit: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--ink-3); font-size: 13px; }
  .theme-btn {
    margin-left: auto; background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
    font-size: 13px; cursor: pointer;
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
       margin: 32px 0 12px; font-weight: 600; }
  .empty { color: var(--ink-3); padding: 24px 4px; line-height: 1.6; }
  /* Its own class, not `.empty`: the owners section's tests count the page's
     empty states, and a second one indistinguishable from theirs would make
     their assertion about that section pass or fail on this one. */
  .rbac-empty { color: var(--ink-3); padding: 12px 4px; line-height: 1.6; }
  .mig-empty { color: var(--ink-3); padding: 24px 4px; line-height: 1.6; }
  .mig-hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px;
              color: var(--ink-3); overflow-wrap: anywhere; line-height: 1.35; margin-top: 3px; }
  .mig-wait { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
              color: var(--ink-2); overflow-wrap: anywhere; }
  .own-row.mig-notApplied, .own-row.mig-notRecorded { background: var(--debt-bg); }
  .own-row.mig-unregistered { box-shadow: inset 3px 0 0 var(--crit); }
  .rbac-contract { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 18px; }
  .rbac-hist { margin-top: 10px; }
  /* An address on the Role changes tab reads as the deploy repo's name for it,
     the hex beside it as the secondary fact. One the repo does not pin gets a
     red mark: an unknown role holder is the thing that must stand out. */
  .rbac-who { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
  .rbac-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
               font-weight: 650; color: var(--ink); overflow-wrap: anywhere; }
  .rbac-who .rbac-name + .own-addr { font-size: 11px; color: var(--ink-3); }
  .rbac-names-gap { color: var(--crit); }
  .rbac-held-nets { margin-bottom: 18px; }
  .rbac-held-roles { font-size: 13px; margin-bottom: 4px; }
  .rbac-unknown { font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 650;
                  color: var(--crit); border: 1px solid var(--crit); border-radius: 5px; padding: 1px 5px; }
  .own-row.rbac-off { background: var(--debt-bg); }
  .rbac-pair { display: inline-flex; align-items: baseline; gap: 5px; }
  .viol-role.rbac-unexpected { color: var(--crit); }
  .viol-role.rbac-grant { color: var(--debt); }
  .rbac-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 650;
              border: 1px solid; border-radius: 5px; padding: 1px 5px; white-space: nowrap; }
  .rbac-tag-unexpected { color: var(--crit); }
  .rbac-tag-grant { color: var(--debt); }
  .own-sub.rbac-ideal-gap, .own-note.rbac-ideal-gap, .own-note.rbac-ideal-off { color: var(--crit); }
  /* Governance timelock operations. A pending one is a change to production
     that happens unless someone cancels it, so it is a boxed card in the
     rollout amber; one whose call lands on a contract the timelock governs
     gets the red edge — that is the operation a reader is here to catch.
     Executed and cancelled ones are history, in the ordinary table. */
  .tl-sec { margin: 6px 0 22px; }
  .tl-op { display: grid; grid-template-columns: 210px 1fr; gap: 8px 16px; align-items: start;
           border: 1px solid var(--debt-border); background: var(--debt-bg); border-radius: 11px;
           padding: 11px 14px; margin: 8px 0; }
  .tl-op.tl-governs { border: 2px solid var(--crit); }
  .tl-when { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .tl-call + .tl-call { border-top: 1px dashed var(--border); padding-top: 5px; }
  .tl-data { overflow-wrap: anywhere; word-break: break-all; opacity: 0.8; }
  .tl-pred, .tl-exec { max-width: 100%; overflow-wrap: anywhere; }
  .tl-hist .own-row { opacity: 0.85; }
  @media (max-width: 620px) {
    .tl-op { grid-template-columns: 1fr; }
  }
  footer { margin-top: 40px; color: var(--ink-3); font-size: 12px; }
  footer a { color: var(--ink-3); }
  .nav { display: flex; flex-wrap: wrap; gap: 2px; margin: 14px 0 6px; border-bottom: 1px solid var(--border); }
  .nav a { padding: 8px 13px; color: var(--ink-2); text-decoration: none; font-size: 13.5px;
           border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .nav a:hover { color: var(--ink); }
  .nav a.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  /* Sub-tabs within one page. Deliberately lighter than `.nav` — a second bar
     styled identically to the site nav reads as a second site. */
  .subnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 4px; }
  .subnav-btn {
    background: var(--surface); color: var(--ink-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .subnav-btn:hover { color: var(--ink); }
  .subnav-btn.active { color: var(--ink); border-color: var(--accent); background: var(--surface-2); }
  /* Hidden, not removed: the panel stays in the DOM so a find-in-page still
     reaches it and so "is X reported?" does not depend on the open tab. */
  .tab-hidden { display: none; }
  /* A violated expectation, listed under its chain's banner. Indented under the
     banner rather than styled as another banner: these are the detail of the
     line above, not five more findings. */
  .viol { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
          margin: 0 0 3px 14px; font-size: 12.5px; line-height: 1.5; }
  .viol-role { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-weight: 650; color: var(--ink); }
  .viol-want { color: var(--ink-3); }
  .viol-got { color: var(--debt); }
  /* ---- Known owners ---- */
  .own-sub { color: var(--ink-3); font-size: 13px; margin: 0 0 4px; line-height: 1.55; max-width: 78ch; }
  .own-sub a { color: var(--ink-2); }
  .own-group { margin: 22px 0; }
  .own-grouphead { font-size: 14.5px; font-weight: 650; color: var(--ink); margin: 0 0 2px; }
  .own-groupnote { color: var(--ink-3); font-size: 12.5px; margin: 0 0 9px; line-height: 1.55; max-width: 78ch; }
  .own-table { border: 1px solid var(--border); border-radius: 11px; overflow: hidden; }
  .own-row { display: grid; grid-template-columns: 210px 1fr auto; gap: 8px 16px; align-items: start;
             padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .own-row:last-child { border-bottom: 0; }
  .own-row.own-migrated, .own-row.own-bricked { opacity: 0.7; }
  .own-row.own-extra { background: var(--debt-bg); }
  .own-row.hlth-missing, .own-row.hlth-mismatch, .own-row.hlth-drift { background: var(--debt-bg); }
  .own-row.hlth-behind, .own-row.hlth-wiring, .own-row.hlth-extra { background: var(--debt-bg); }
  .own-row.hlth-unknown { opacity: 0.7; }
  .bcn-detail { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .bcn-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .bcn-key { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em;
             color: var(--ink-3); width: 78px; flex-shrink: 0; }
  .tok-val { font-size: 12px; word-break: break-word; }
  .tok-h3 { font-size: 15px; font-weight: 650; margin: 22px 0 2px; }
  .own-role { font-size: 14px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .own-note { color: var(--ink-3); font-size: 12px; margin-top: 3px; line-height: 1.5; }
  .own-ac { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 10px; }
  .own-addr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
              color: var(--ink-2); text-decoration: none; word-break: break-all; }
  a.own-addr:hover { color: var(--accent); text-decoration: underline; }
  .own-missing { color: var(--crit); font-style: italic; }
  .own-net { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3);
             border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
  .own-status { display: inline-flex; align-items: center; font-size: 11px; text-transform: uppercase;
                letter-spacing: 0.04em; font-weight: 650; border-radius: 6px; padding: 3px 7px;
                white-space: nowrap; border: 1px solid var(--border); color: var(--ink-3); }
  .own-status-active { color: var(--clean); border-color: var(--clean); }
  .own-status-pending { color: var(--debt); border-color: var(--debt-border); background: var(--debt-bg); }
  .own-status-migrated { color: var(--ink-3); border-color: var(--border); }
  .own-status-bricked { color: var(--crit); border-color: var(--crit); }
  /* Governed-vault ownership. `timelock` is where the migration is taking these,
     so it is the clean state; `safe` is the pre-migration holder and reads as
     work still to do rather than a fault, which is the amber the rest of the
     site uses for rollout. `other` is the answer nobody predicted — neither
     pin — so it gets the red. */
  .own-status-timelock { color: var(--clean); border-color: var(--clean); }
  .own-status-safe { color: var(--debt); border-color: var(--debt-border); background: var(--debt-bg); }
  .own-status-other { color: var(--crit); border-color: var(--crit); }
  /* No timelock pinned for the chain yet, so there is nothing to recognise a
     move by. Amber, like every other rollout state on this site — red here
     would report a chain the rollout has not reached as a fault. */
  .own-status-unpinned { color: var(--debt); border-color: var(--debt-border); background: var(--debt-bg); }
  .own-status-notpinned { color: var(--debt); border-color: var(--debt-border); background: var(--debt-bg); }
  .own-status-notonchain { color: var(--crit); border-color: var(--crit); }
  .own-row.own-other { background: var(--debt-bg); }
  .own-status-unknown, .own-cert-unknown { color: var(--crit); border-color: var(--crit); font-style: italic; }
  .own-cert-current { color: var(--clean); border-color: var(--clean); }
  .own-cert-expired { color: var(--crit); border-color: var(--crit); background: var(--debt-bg); }
  .vault-clean { margin: 6px 0 14px; font-size: 12.5px; color: var(--ink-3); }
  .vault-clean > summary { cursor: pointer; padding: 4px 0; }
  .own-verify { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
                border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px;
                margin: 0 0 10px; font-size: 12.5px; line-height: 1.5; }
  .own-verify-ok { background: var(--clean-bg); border-color: var(--clean); }
  .own-verify-drift { background: var(--debt-bg); border-color: var(--crit); }
  .own-verify-error { background: var(--debt-bg); border-color: var(--crit); border-width: 2px; }
  .own-verify-down { background: var(--surface); color: var(--ink-3); }
  .own-verify-msg { font-weight: 600; color: var(--ink); }
  .own-verify-ok .own-verify-msg::before { content: "✓ "; color: var(--clean); font-weight: 700; }
  .own-verify-drift .own-verify-msg::before { content: "⚠ "; color: var(--crit); font-weight: 700; }
  .own-verify-error .own-verify-msg::before { content: "✗ "; color: var(--crit); font-weight: 700; }
  .own-verify-thr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-2); }
  .own-verify-src { color: var(--ink-3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .own-prov { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; justify-content: flex-end; }
  .own-chip { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 650;
              border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
  .own-chip-yes { color: var(--clean); border-color: var(--clean); }
  .own-chip-no { color: var(--crit); border-color: var(--crit); }
  .own-chip-dim { color: var(--ink-3); border-color: var(--border); }
  .own-chip-target { color: var(--accent); border-color: var(--accent); }
  /* A pinned grant not yet held on a chain is a ROLLOUT state, not a fault: the
     deploy repo's model has a chain's grants absent until its provisioning
     bundle executes, so "granted on Base, not yet on Ethereum" is a true and
     expected reading. It gets the status amber the rest of the site uses for
     work-to-do, never the red reserved for something that is wrong. */
  .own-chip-roll { color: var(--debt); border-color: var(--debt-border); background: var(--debt-bg); }
  .own-verify-roll { background: var(--debt-bg); border-color: var(--debt-border); }
  .own-verify-roll .own-verify-msg::before { content: "◐ "; color: var(--debt); font-weight: 700; }
  .grt-addr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 7px; margin-top: 3px; }
  /* Role names run to SCHEDULE_CORPORATE_ACTION_ADMIN. The shared .bcn-key is
     78px and does not shrink, so those names overflowed it and printed straight
     over the chips beside them — unreadable, and the overlap looked like a
     rendering fault rather than a long word. This key is wide enough for the
     longest name the grant map carries and wraps rather than overflowing, so a
     longer one added later still lands inside its own column. */
  .grt-role { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em;
              color: var(--ink-3); width: 200px; flex-shrink: 0; overflow-wrap: anywhere;
              line-height: 1.35; }
  /* The role id, rendered IN FULL beside the name. A truncated hash cannot be
     matched against a `grantRole` calldata word, which is the only reason this
     is on the page, so it is not abbreviated. Monospace and dimmed so it reads
     as a reference value rather than competing with the name.
     Sized by its content and allowed to shrink (`min-width: 0` so a flex item
     actually can): a fixed column wide enough for 32 bytes forces a wrap even
     where the row has room, and one narrow enough not to would clip the only
     thing the column is for. Cramped, it wraps mid-hash rather than pushing the
     row sideways. */
  .grt-roleid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 10.5px; color: var(--ink-3); opacity: 0.75;
                flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere;
                line-height: 1.35; }
  @media (max-width: 620px) {
    .own-row { grid-template-columns: 1fr; gap: 5px; }
    .own-prov { justify-content: flex-start; }
  }
</style>

<div class="wrap">
  <header>
    <h1>rain org health</h1>
    <span class="meta" id="meta">loading…</span>
    <button class="theme-btn" id="theme" aria-label="Toggle theme">◐ theme</button>
  </header>
  <nav class="nav">
    <a href="deployments.html" class="active">Deployments</a>
    <a href="pipeline.html">Pipeline</a>
    <a href="audit.html">Audit</a>

  </nav>
  <div id="deployments">loading…</div>
  <footer>
    Org-health dashboard — status, not severity; identity is the label, not the color.
    <a href="https://github.com/rainlanguage/rain-org-health" rel="noopener noreferrer" target="_blank">source</a>.
  </footer>

<script type="module">
const $ = (id) => document.getElementById(id);
// Theme toggle: default follows the OS; the button stamps data-theme to override.
$("theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
});
// Renders the deployments view into #deployments. Kept a top-level function with
// locally-declared helpers so test/dashboard.test.js can extract and eval it standalone.
// `io` carries the network and the clock (`fetch`, `now`) for the live role-change
// read, so a test can stand both in. Returns a promise that settles once that read
// has rendered.
function renderDeployments(document, $, data, io) {
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const link = (cls, text, href) => {
    const a = el("a", cls, text);
    a.href = href;
    a.rel = "noopener noreferrer";
    a.target = "_blank";
    return a;
  };
  // A privileged address is the same on every chain except where the constant is
  // network-specific; Base is the home network, so it is the default explorer.
  //
  // Every chain the deploy repo pins is named, not just Base and Ethereum. An
  // unnamed chain falling back to Base sends the reader to an address that on
  // Base is a different contract, or nothing — a link that looks like
  // verification and is not. The hosts are the ones st0x.deploy's own pins
  // document for each chain.
  const EXPLORERS = {
    base: "https://basescan.org/address/",
    ethereum: "https://etherscan.io/address/",
    hyperevm: "https://hyperevmscan.io/address/",
    robinhood: "https://robinhoodchain.blockscout.com/address/",
    bsc: "https://bscscan.com/address/",
  };
  const explorer = (address, network) =>
    EXPLORERS[network] ? EXPLORERS[network] + address : null;
  // An address on a chain this page has no explorer for renders as plain text,
  // never as a Base link. Falling back to Basescan sends the reader to an
  // address that on Base is a different contract, or nothing — a link that
  // looks like verification and is not. Unlinked is honest; wrongly linked is
  // worse than nothing.
  const addrNode = (cls, address, network) => {
    const href = explorer(address, network);
    return href ? link(cls, address, href) : el("span", cls, address);
  };
  // Declared-vs-on-chain verdict banner for a group that carries a verification.
  const verifyBanner = (v) => {
    let cls, msg;
    if (!v.reachable) {
      cls = "down";
      msg = "On-chain check incomplete — an RPC call didn't return; treat as unverified.";
    } else if (v.match) {
      cls = "ok";
      msg =
        `Declared roster matches the live Safe — ${v.onChainCount} of ${v.onChainCount} ` +
        `owners confirmed by getOwners() on ${v.network}.`;
    } else {
      cls = "drift";
      msg = "Drift — the declared roster differs from the live Safe; see the flagged rows.";
    }
    const b = el("div", `own-verify own-verify-${cls}`);
    b.append(el("span", "own-verify-msg", msg));
    const t = v.threshold;
    if (t) {
      b.append(
        el(
          "span",
          "own-verify-thr",
          t.onChain == null
            ? `threshold ${t.declared} (constant)`
            : `threshold ${t.declared} (constant) · ${t.onChain} (on-chain)${t.match ? " ✓" : " ✗"}`,
        ),
      );
    }
    if (v.safe) b.append(el("span", "own-verify-src", `Safe ${v.safe} · via ${v.rpcHost}`));
    return b;
  };
  const box = $("deployments");
  box.textContent = "";

  // Sub-tabs. This page had grown to six stacked sections across five chains,
  // which is more than one scroll can hold in the head.
  //
  // Every panel is BUILT and kept in the DOM; the tabs toggle visibility. The
  // alternative — rendering only the active tab — would mean a reader's
  // ctrl-F misses what is on another tab, and would make "is X reported?"
  // depend on which tab happened to be open.
  const TABS = [
    ["safe", "Safe & ownership"],
    ["contracts", "Contracts & tokens"],
    ["rbac", "Role changes"],
    ["held", "Roles held"],
    ["registry", "Root registry"],
    ["migrations", "Migrations"],
  ];
  const subnav = el("div", "subnav");
  const panels = {};
  for (const [id] of TABS) {
    panels[id] = el("div", "tabpanel");
    panels[id].dataset.tab = id;
  }
  const show = (id) => {
    for (const [t] of TABS) {
      panels[t].classList.toggle("tab-hidden", t !== id);
    }
    for (const b of subnav.children) {
      b.classList.toggle("active", b.dataset.tab === id);
    }
  };
  // The open tab is in the URL fragment, so a tab is linkable and — the reason
  // this exists rather than being a nicety — screenshottable. The repo rule for
  // `site/**` requires seeing a visual change before claiming it, and
  // `nix run .#screenshot` loads a URL and cannot click: without a fragment,
  // every tab but the first is unverifiable.
  //
  // Guarded because the render runs under a DOM stub in the tests, where there
  // is no `location`. An unknown fragment falls back to the first tab rather
  // than showing nothing.
  const hashTab = () => {
    if (typeof location === "undefined" || !location.hash) return null;
    const want = location.hash.replace(/^#/, "");
    return TABS.some(([t]) => t === want) ? want : null;
  };
  for (const [id, label] of TABS) {
    const b = el("button", "subnav-btn", label);
    b.dataset.tab = id;
    b.addEventListener("click", () => {
      show(id);
      // Record the open tab without pushing a history entry per click.
      if (typeof history !== "undefined" && history.replaceState) {
        history.replaceState(null, "", "#" + id);
      }
    });
    subnav.append(b);
  }
  box.append(subnav, ...TABS.map(([id]) => panels[id]));

  // Where the section renderers append. Reassigned between groups rather than
  // threaded through every renderer as an argument, so a section moves tab by
  // moving one line instead of changing a signature.
  let sink = panels.safe;
  // On-chain health of a pinned suite: each contract deployed at its pinned
  // address with the live runtime code AND keccak codehash both matching.
  const renderHealth = (health) => {
    if (!health || !Array.isArray(health.contracts) || health.contracts.length === 0) return;
    sink.append(el("h2", null, `${health.version} suite — ${health.network} health`));
    const hsub = el("div", "own-sub");
    hsub.append(`Each pinned ${health.version} contract from `);
    hsub.append(link("", `${health.org}/${health.repo}`, `https://github.com/${health.org}/${health.repo}`));
    hsub.append(
      `, checked live on ${health.network}: deployed at its pinned address with the runtime code and keccak codehash both matching the pins.`,
    );
    sink.append(hsub);
    const allHealthy = health.healthy === health.total;
    const hb = el("div", `own-verify ${allHealthy ? "own-verify-ok" : "own-verify-drift"}`);
    hb.append(
      el("span", "own-verify-msg", `${health.healthy} of ${health.total} contracts healthy on ${health.network}.`),
    );
    hb.append(el("span", "own-verify-src", `via ${health.rpcHost}`));
    sink.append(hb);
    const chipFor = (label, v) =>
      el(
        "span",
        `own-chip own-chip-${v === true ? "yes" : v === false ? "no" : "dim"}`,
        `${label} ${v === true ? "✓" : v === false ? "✗" : "—"}`,
      );
    const table = el("div", "own-table");
    for (const c of health.contracts) {
      const st = c.status || "unknown";
      const row = el("div", `own-row hlth-${st}`);
      const rc = el("div", "own-rc");
      rc.append(el("div", "own-role", c.name));
      const ac = el("div", "own-ac");
      if (c.address) ac.append(addrNode("own-addr", c.address, health.network));
      else ac.append(el("span", "own-addr own-missing", "— no pin"));
      const tail = el("div", "own-prov");
      const stCls = st === "healthy" ? "yes" : st === "unknown" ? "dim" : "no";
      tail.append(el("span", `own-chip own-chip-${stCls}`, st));
      tail.append(chipFor("code", c.codeMatch));
      tail.append(chipFor("keccak", c.hashMatch));
      // ERC-165 conformance is a string status, not a bool: conformant / non-
      // conformant (a spec violation) / absent (no supportsInterface) / unknown.
      const e165 = c.erc165 || "unknown";
      const e165cls = e165 === "conformant" ? "yes" : e165 === "nonconformant" ? "no" : "dim";
      const e165sym =
        e165 === "conformant" ? "✓" : e165 === "nonconformant" ? "✗" : e165 === "absent" ? "—" : "?";
      tail.append(el("span", `own-chip own-chip-${e165cls}`, `erc165 ${e165sym}`));
      row.append(rc, ac, tail);
      table.append(row);
    }
    sink.append(table);
  };
  // Production beacons: each should be held by a GOVERNING owner — the
  // token-owner Safe, or the governance timelock once the migration has handed
  // that chain over — and point at its pinned impl.
  const renderBeaconSet = (b) => {
    if (!b) return;
    // A chain the scan could not read says so under its own heading. Returning
    // silently would drop the whole section, and a missing section reads as
    // "this chain has no production beacons" rather than "this broke".
    if (b.unavailable || !Array.isArray(b.beacons) || b.beacons.length === 0) {
      sink.append(el("h2", null, `Beacons — ${b.network ?? "unknown chain"}`));
      sink.append(
        el(
          "div",
          "own-sub",
          `Beacon data unavailable — ${b.reason ?? "the scan produced no beacons for this chain"}${b.rpcHost ? ` (via ${b.rpcHost})` : ""}.`,
        ),
      );
      return;
    }
    sink.append(el("h2", null, `Beacons — ${b.network}`));
    sink.append(
      el(
        "div",
        "own-sub",
        `Each production beacon should be held by the token-owner Safe or that chain's governance timelock, and pointing at its target (${b.targetVersion}) implementation — owner() and implementation() read live on-chain and resolved to who/what they actually are.`,
      ),
    );
    const allHealthy = b.healthy === b.total;
    const banner = el("div", `own-verify ${allHealthy ? "own-verify-ok" : "own-verify-drift"}`);
    banner.append(
      el(
        "span",
        "own-verify-msg",
        `${b.healthy} of ${b.total} beacons governed & at ${b.targetVersion} on ${b.network}.`,
      ),
    );
    // Both pins, because `timelock` is what separates healthy from drift here.
    // Showing only the Safe leaves a reader with a `timelock` chip and no
    // address to check it against — they cannot tell this chain's timelock from
    // another chain's, which is an ordinary migration slip.
    if (b.safeOwner) banner.append(el("span", "own-verify-src", `Safe = ${b.safeOwner}`));
    if (b.timelockOwner) {
      banner.append(el("span", "own-verify-src", `timelock = ${b.timelockOwner}`));
    }
    sink.append(banner);
    const explorerLink = (addr) => addrNode("own-addr", addr, b.network);
    const detailLine = (key, chipText, chipCls, addr) => {
      const line = el("div", "bcn-line");
      line.append(el("span", "bcn-key", key));
      line.append(el("span", `own-chip own-chip-${chipCls}`, chipText));
      if (addr) line.append(explorerLink(addr));
      return line;
    };
    const table = el("div", "own-table");
    for (const bc of b.beacons) {
      const st = bc.status || "unknown";
      const row = el("div", `own-row hlth-${st}`);
      const rc = el("div", "own-rc");
      rc.append(el("div", "own-role", bc.name));
      if (bc.address) {
        const note = el("div", "own-note");
        note.append(explorerLink(bc.address));
        rc.append(note);
      }
      const detail = el("div", "bcn-detail");
      // owner: who it actually is
      // `timelock` reads as a governing holder, not a fault: handing the beacons
      // to the governance timelock is what the migration does, so the owner line
      // says so and the status beside it stays healthy.
      const own =
        bc.ownerLabel === "safe"
          ? ["Safe", "yes"]
          : bc.ownerLabel === "timelock"
            ? ["timelock", "yes"]
            : bc.ownerLabel === "legacy"
              ? ["legacy EOA", "no"]
              : bc.ownerLabel === "foreign"
                ? ["foreign", "no"]
                : ["—", "dim"];
      detail.append(detailLine("owner", own[0], own[1], bc.owner));
      // impl: what it points at NOW, and — when it isn't already there — what it
      // SHOULD point at, so a proposed upgradeTo(...) can be checked against both.
      if (bc.atTarget === true) {
        detail.append(detailLine("impl", `${bc.implVersion} ✓`, "yes", bc.implementation));
      } else {
        const nowLabel = bc.atTarget === false ? bc.implVersion : "unknown";
        const nowCls = bc.atTarget === false ? "no" : "dim";
        detail.append(detailLine("now", nowLabel, nowCls, bc.implementation));
        if (bc.targetImpl) {
          detail.append(detailLine("target", bc.targetVersion, "target", bc.targetImpl));
        }
      }
      const stCls = st === "healthy" ? "yes" : st === "unknown" ? "dim" : "no";
      row.append(rc, detail, el("span", `own-chip own-chip-${stCls}`, st));
      table.append(row);
    }
    sink.append(table);
  };
  // One section per chain. Base and Ethereum run on different beacon
  // generations owned by different Safes, so they are separate blocks rather
  // than one merged table whose rows would silently mix chains.
  const renderBeacons = (b) => {
    for (const set of Array.isArray(b) ? b : b ? [b] : []) renderBeaconSet(set);
  };
  // Registry tokens: each wrapper's on-chain identity must match the registry and
  // its asset() must point at the declared unwrapped underlying, with the linked
  // unwrapped/legacy/receipt addresses all deployed.
  const renderTokens = (t) => {
    if (!t || !Array.isArray(t.tokens)) return;
    // No intersection between the registry and the governed set. Say so, with
    // the counts that identify why — an empty section that simply vanishes
    // reads as "this feature does not exist" rather than "this broke".
    const noTokens = t.tokens.length === 0;
    if (noTokens) {
      sink.append(el("h2", null, `Tokens — ${t.network}`));
      const rc = t.reconcile || {};
      // Zero governed vaults and a non-empty-but-disjoint governed set are
      // different failures: the first is an unreadable list, the second a real
      // reconciliation gap whose breakdown is the thing worth reading.
      const cause = typeof rc.error === "string" && rc.error
        ? `The governed list could not be read: ${rc.error}.`
        : (rc.governedCount ?? 0) === 0
        ? "A governed count of 0 means that list could not be read — the section is unavailable, not empty."
        : "The two sets are disjoint — the cross-check below names every vault and token on each side.";
      const nb = el("div", "own-verify own-verify-error");
      nb.append(
        el(
          "span",
          "own-verify-msg",
          `No registry token resolved to a governed receipt vault: ${rc.governedCount ?? "?"} governed vault(s) from ${rc.function ?? "the migration set"}, ${rc.registryTokenCount ?? "?"} registry token(s). ${cause}`,
        ),
      );
      sink.append(nb);
    } else {
      sink.append(el("h2", null, `Tokens — ${t.network}`));
      const tsub = el("div", "own-sub");
      tsub.append("Each token in the ");
      tsub.append(link("", `${t.org}/${t.repo}`, `https://github.com/${t.org}/${t.repo}`));
      tsub.append(
        ` Base list, checked live on ${t.network}: name/symbol/decimals match the registry verbatim, asset() points at the declared unwrapped underlying, and the unwrapped/legacy/receipt addresses are deployed.`,
      );
      sink.append(tsub);
      const allOk = t.ok === t.total;
      const tb = el("div", `own-verify ${allOk ? "own-verify-ok" : "own-verify-drift"}`);
      tb.append(
        el("span", "own-verify-msg", `${t.ok} of ${t.total} tokens fully wired on ${t.network}.`),
      );
      tb.append(el("span", "own-verify-src", `via ${t.rpcHost}`));
      sink.append(tb);
    }
    const explorerLink = (addr) => addrNode("own-addr", addr, t.network);
    // The setAuthorizer migration target, stated once: what a pending Safe bundle
    // rewires every receipt vault's authorizer() to, and how many are already there.
    const auth = t.authoriser;
    if (auth && auth.target) {
      const allAt = t.atAuthoriserTarget === t.wrappedCount;
      const ab = el("div", `own-verify ${allAt ? "own-verify-ok" : "own-verify-drift"}`);
      const dep =
        auth.targetDeployed === true
          ? "deployed"
          : auth.targetDeployed === false
            ? "NOT deployed"
            : "deploy state unknown";
      ab.append(
        el(
          "span",
          "own-verify-msg",
          `Authoriser migration — ${t.atAuthoriserTarget} of ${t.wrappedCount} receipt vaults at the V4-clone target (${dep}); a setAuthorizer bundle rewires the rest.`,
        ),
      );
      ab.append(el("span", "own-verify-src", `target ${auth.target}`));
      sink.append(ab);
    }
    const okChip = (label, v) => {
      const sym = v === true ? "✓" : v === false ? "✗" : "—";
      const cls = v === true ? "yes" : v === false ? "no" : "dim";
      return el("span", `own-chip own-chip-${cls}`, label ? `${label} ${sym}` : sym);
    };
    // The resolved-authoriser chip: what authorizer() actually is right now.
    const authChip = (lbl) => {
      const m = {
        target: ["V4 clone ✓", "yes"],
        current: ["current prod authoriser", "no"],
        none: ["unset", "no"],
        foreign: ["foreign", "no"],
      }[lbl] || ["—", "dim"];
      return el("span", `own-chip own-chip-${m[1]}`, m[0]);
    };
    // The authoriser rows (now + → target) shared by registry tokens and the extra
    // governed vaults: what authorizer() is NOW, and the target it should become.
    const authRows = (detail, o) => {
      const anl = el("div", "bcn-line");
      anl.append(el("span", "bcn-key", "authoriser"));
      anl.append(authChip(o.authoriserLabel));
      if (o.authoriser) anl.append(explorerLink(o.authoriser));
      detail.append(anl);
      if (o.atAuthoriserTarget === false && o.authoriserTarget) {
        const atl = el("div", "bcn-line");
        atl.append(el("span", "bcn-key", "target"));
        atl.append(el("span", "own-chip own-chip-target", "V4 clone"));
        atl.append(explorerLink(o.authoriserTarget));
        detail.append(atl);
      }
    };
    // Cross-check the registry against the migration's authoritative vault set:
    // governed vaults the registry doesn't list (surfaced with their authoriser so
    // the whole setAuthorizer bundle is reviewable), and any registry vault the
    // migration misses.
    const renderReconcile = (rec) => {
      if (!rec) return;
      const extra = Array.isArray(rec.extraVaults) ? rec.extraVaults : [];
      const missing = Array.isArray(rec.missingFromMigration) ? rec.missingFromMigration : [];
      if (!extra.length && !missing.length) return;
      sink.append(el("h3", "tok-h3", "Migration set cross-check"));
      sink.append(
        el(
          "div",
          "own-sub",
          `${rec.source} · ${rec.function} — the authoritative vault set the setAuthorizer bundle operates on.`,
        ),
      );
      const rb = el("div", "own-verify own-verify-drift");
      rb.append(
        el(
          "span",
          "own-verify-msg",
          `${rec.governedCount} governed receipt vaults · ${rec.registryTokenCount} registry tokens — ${extra.length} governed vault(s) not in the registry, ${missing.length} registry token(s) not in the migration. The bundle has one setAuthorizer per governed vault.`,
        ),
      );
      sink.append(rb);
      if (extra.length) {
        const etable = el("div", "own-table");
        for (const v of extra) {
          const row = el("div", "own-row hlth-extra");
          const rc = el("div", "own-rc");
          rc.append(el("div", "own-role", v.symbol || "(unknown)"));
          if (v.name) rc.append(el("div", "own-note", v.name));
          const note = el("div", "own-note");
          note.append(explorerLink(v.address));
          rc.append(note);
          rc.append(el("div", "own-note", "not in registry"));
          const detail = el("div", "bcn-detail");
          authRows(detail, v);
          row.append(rc, detail, el("span", "own-chip own-chip-no", "unlisted"));
          etable.append(row);
        }
        sink.append(etable);
      }
      if (missing.length) {
        const mb = el("div", "own-verify own-verify-drift");
        mb.append(
          el(
            "span",
            "own-verify-msg",
            `${missing.length} registry token(s) have no governed receipt vault — not in the setAuthorizer bundle (a plain collateral token like USDC is expected; a wrapped token here is a gap).`,
          ),
        );
        sink.append(mb);
        const mtable = el("div", "own-table");
        for (const m of missing) {
          // A wrapped token that isn't governed is a real gap (red); a plain
          // collateral token with no vault is expected (dim).
          const row = el("div", `own-row ${m.wrapped ? "hlth-mismatch" : "hlth-extra"}`);
          const rc = el("div", "own-rc");
          rc.append(el("div", "own-role", m.symbol || "(unknown)"));
          if (m.name) rc.append(el("div", "own-note", m.name));
          const note = el("div", "own-note");
          note.append(explorerLink(m.receiptVault || m.address));
          rc.append(note);
          rc.append(el("div", "own-note", m.reason || "not in migration set"));
          const pill = m.wrapped
            ? el("span", "own-chip own-chip-no", "unmigrated")
            : el("span", "own-chip own-chip-dim", "collateral");
          row.append(rc, el("div", "bcn-detail"), pill);
          mtable.append(row);
        }
        sink.append(mtable);
      }
    };
    // Deferred to here rather than run from the empty-token branch above: the
    // helpers this renderer closes over are declared between that branch and
    // this line, so calling it earlier reaches them in their dead zone.
    if (noTokens) {
      renderReconcile(t.reconcile);
      return;
    }
    const table = el("div", "own-table");
    for (const tk of t.tokens) {
      const st = tk.status || "unknown";
      const row = el("div", `own-row hlth-${st}`);
      const rc = el("div", "own-rc");
      rc.append(el("div", "own-role", tk.symbol));
      if (tk.name) rc.append(el("div", "own-note", tk.name));
      if (tk.address) {
        const note = el("div", "own-note");
        note.append(explorerLink(tk.address));
        rc.append(note);
      }
      const detail = el("div", "bcn-detail");
      // identity: the three registry fields read back from the token contract.
      const idl = el("div", "bcn-line");
      idl.append(el("span", "bcn-key", "identity"));
      idl.append(okChip("name", tk.nameOk));
      idl.append(okChip("symbol", tk.symbolOk));
      idl.append(okChip("decimals", tk.decimalsOk));
      detail.append(idl);
      // For any identity field that disagrees, show the on-chain value NOW next to
      // the registry value it SHOULD be, so the actual difference is visible.
      const fmt = (v) => (v === null || v === undefined ? "—" : `“${v}”`);
      const idDiff = (key, ok, live, expected) => {
        if (ok !== false) return;
        const now = el("div", "bcn-line");
        now.append(el("span", "bcn-key", key));
        now.append(el("span", "own-chip own-chip-no", "on-chain"));
        now.append(el("span", "tok-val", fmt(live)));
        detail.append(now);
        const exp = el("div", "bcn-line");
        exp.append(el("span", "bcn-key", ""));
        exp.append(el("span", "own-chip own-chip-target", "registry"));
        exp.append(el("span", "tok-val", fmt(expected)));
        detail.append(exp);
      };
      idDiff("name", tk.nameOk, tk.liveName, tk.name);
      idDiff("symbol", tk.symbolOk, tk.liveSymbol, tk.symbol);
      idDiff("decimals", tk.decimalsOk, tk.liveDecimals, tk.decimals);
      // A plain collateral token (e.g. USDC) declares no unwrapped underlying, so
      // it has no asset()/wiring to check — identity is the whole verdict.
      if (tk.wrapped) {
        // asset: what asset() returns NOW, and — when it isn't the declared
        // unwrapped — what it SHOULD be, so a proposed re-wire can be checked.
        const al = el("div", "bcn-line");
        al.append(el("span", "bcn-key", "asset"));
        al.append(okChip("", tk.assetOk));
        if (tk.asset) al.append(explorerLink(tk.asset));
        detail.append(al);
        if (tk.assetOk === false && tk.unwrapped) {
          const xl = el("div", "bcn-line");
          xl.append(el("span", "bcn-key", "expected"));
          xl.append(el("span", "own-chip own-chip-target", "unwrapped"));
          xl.append(explorerLink(tk.unwrapped));
          detail.append(xl);
        }
        // linked deploys — only the addresses the registry actually declares.
        for (const [key, ok, addr] of [
          ["unwrapped", tk.unwrappedDeployed, tk.unwrapped],
          ["legacy", tk.legacyDeployed, tk.legacy],
          ["receipt", tk.receiptDeployed, tk.receipt],
        ]) {
          if (!addr) continue;
          const dl = el("div", "bcn-line");
          dl.append(el("span", "bcn-key", key));
          dl.append(okChip("", ok));
          dl.append(explorerLink(addr));
          detail.append(dl);
        }
        // authoriser: what authorizer() on the receipt vault resolves to NOW, and
        // — when it isn't yet the V4-clone target — the target the setAuthorizer
        // bundle sets, so the proposed transaction can be checked per vault.
        authRows(detail, tk);
      }
      // registry→migration membership, shown on EVERY registry entry so the
      // reconcile is visible per token: a wrapped token shows whether its receipt
      // vault is in the setAuthorizer bundle; a plain token (USDC) has no receipt
      // vault, so it is out of scope — shown, not silently dropped.
      {
        const ml = el("div", "bcn-line");
        ml.append(el("span", "bcn-key", "migration"));
        if (!tk.wrapped) {
          ml.append(el("span", "own-chip own-chip-dim", "—"));
          ml.append(
            el("span", "tok-val", "no receipt vault (collateral) — not in the migration"),
          );
        } else {
          ml.append(okChip("", tk.inMigrationSet));
          ml.append(
            el(
              "span",
              "tok-val",
              tk.inMigrationSet ? "in setAuthorizer bundle" : "NOT in bundle — will not be migrated",
            ),
          );
        }
        detail.append(ml);
      }
      const stCls = st === "ok" ? "yes" : st === "unknown" ? "dim" : "no";
      row.append(rc, detail, el("span", `own-chip own-chip-${stCls}`, st));
      table.append(row);
    }
    sink.append(table);
    renderReconcile(t.reconcile);
  };
  // Authoriser role grants: who holds each pinned (role, grantee) pair, and on
  // which chains it is actually live.
  //
  // The Safe above answers "who can upgrade". This answers "who can move value"
  // — the hot service keys — and the two are NOT a partition of the principals:
  // the Safe holds DEPOSIT / WITHDRAW / CERTIFY directly as well as every
  // _ADMIN. So admin-vs-action splits the ROLES here, inside one section, rather
  // than splitting the page; a top-level split would have to file the Safe under
  // both headings or misfile it under one.
  //
  // Every row is derived from the scan's read of the deploy repo's grant map.
  // Nothing about a grantee is written down on this page, so a signer added to
  // that map arrives here on the next scan.
  // Governed-vault ownership, which the governance migration moves one
  // Every receipt vault st0x.deploy publishes, per chain: owner() against that
  // chain's timelock, and isCertificationExpired(). Problems first; clean
  // vaults are folded away so a warning is never buried under fifty rows.
  //
  // An ALLOWLIST of labels: one added to the Rust later has no CSS here, so it
  // is counted and named rather than rendered as the quietest row on the page.
  const VAULT_LABELS = ["safe", "timelock", "other", "unpinned", "unknown"];
  const vaultBanner = (kind, msg) => {
    const b = el("div", `own-verify own-verify-${kind}`);
    b.append(el("span", "own-verify-msg", msg));
    return b;
  };
  // Every field is untrusted: a throw here abandons the rest of the page.
  const vaultChain = (c) => {
    const rowsIn = Array.isArray(c.vaults) ? c.vaults : [];
    const known = rowsIn.filter(
      (x) => x && typeof x === "object" && VAULT_LABELS.includes(x.label),
    );
    const n = (label) => known.filter((x) => x.label === label).length;
    const notTimelock = known.filter((x) => x.label !== "timelock" && x.label !== "unknown");
    const expired = known.filter((x) => x.certificationExpired === true);
    const certUnread = known.filter((x) => typeof x.certificationExpired !== "boolean");
    const notPinned = known.filter((x) => x.pinned === false);
    const notOnChain = known.filter((x) => x.onChain === false);
    const errors = [];
    if (typeof c.error === "string" && c.error) errors.push(c.error);
    else if (rowsIn.length === 0) errors.push("no receipt vaults listed");
    if (typeof c.discoveryError === "string" && c.discoveryError) {
      errors.push(`on-chain vault discovery failed: ${c.discoveryError}`);
    } else if (typeof c.discoveredCount !== "number") {
      errors.push("on-chain vault discovery did not run");
    }
    if (notOnChain.length > 0) {
      errors.push(`${notOnChain.length} pinned in privileged-addresses.json but not found on-chain`);
    }
    if (n("unknown") > 0) errors.push(`${n("unknown")} owner() read(s) failed`);
    if (certUnread.length > 0) {
      errors.push(`${certUnread.length} isCertificationExpired() read(s) failed`);
    }
    if (rowsIn.length > known.length) {
      errors.push(`${rowsIn.length - known.length} with a label this page does not know`);
    }
    const warnings = [];
    if (notTimelock.length > 0) {
      warnings.push(`${notTimelock.length} of ${rowsIn.length} not owned by the timelock`);
    }
    if (expired.length > 0) {
      warnings.push(`${expired.length} with expired certification`);
    }
    if (notPinned.length > 0) {
      warnings.push(`${notPinned.length} on-chain but not pinned in privileged-addresses.json`);
    }
    return { rowsIn, known, n, notPinned, notOnChain, errors, warnings };
  };

  const renderVaultOwners = (v) => {
    sink.append(el("h2", null, "Receipt vaults — owner and certification"));
    const chains = v && typeof v === "object" && Array.isArray(v.chains)
      ? v.chains.filter((c) => c && typeof c === "object")
      : [];
    if (!v || typeof v !== "object" || v.error || chains.length === 0) {
      const why = v && typeof v.error === "string" && v.error
        ? v.error
        : "the scan read no receipt vaults";
      sink.append(vaultBanner("error", `Receipt vaults unavailable — ${why}.`));
      return;
    }
    const sub = el("div", "own-sub");
    sub.append(
      `Every receipt vault in st0x.deploy's ${typeof v.source === "string" ? v.source : "privileged-addresses.json"}, ` +
        `plus every one its vault deployer's Deployment events record on-chain (via st0x.deploy's subgraph), ` +
        `read live per chain: owner() against THAT chain's timelock, and isCertificationExpired(). ` +
        `"not pinned" is on-chain but missing from the file; "not on-chain" is in the file but was never deployed by the deployer. ` +
        `"safe" is the chain's token-owner Safe; "other" is an owner that is neither pin; ` +
        `"unpinned" means the chain has no timelock pinned to compare against; ` +
        `"unknown" means the read failed, never that the vault has not moved.`,
    );
    sink.append(sub);
    const per = chains.map((c) => ({
      c,
      net: typeof c.network === "string" && c.network ? c.network : "unnamed chain",
      r: vaultChain(c),
    }));
    const summary = (key) =>
      per.filter((p) => p.r[key].length > 0).map((p) => `${p.net}: ${p.r[key].join(", ")}`);
    const errs = summary("errors");
    const warns = summary("warnings");
    if (errs.length > 0) sink.append(vaultBanner("error", errs.join(" · ")));
    if (warns.length > 0) sink.append(vaultBanner("drift", warns.join(" · ")));
    if (errs.length === 0 && warns.length === 0) {
      sink.append(
        vaultBanner("ok", "Every receipt vault is owned by its chain's timelock with current certification."),
      );
    }
    for (const { c, net, r } of per) {
      sink.append(
        el(
          "h3",
          null,
          `${net} — ${r.n("timelock")} timelock, ${r.n("safe")} safe, ${r.n("other")} other, ` +
            `${r.n("unpinned")} unpinned, ${r.n("unknown")} unknown of ${r.rowsIn.length}` +
            ` — ${r.notPinned.length} not pinned, ${r.notOnChain.length} not on-chain`,
        ),
      );
      // The chain's own pins, so an `other` owner can be told from this chain
      // holding ANOTHER chain's timelock.
      const found = typeof c.discoveredCount === "number"
        ? ` · ${c.discoveredCount} found on-chain at block ${c.discoveredAtBlock ?? "?"}`
        : "";
      if (c.safe || c.timelock || found) {
        const pins = el("div", "own-groupnote");
        pins.append(`safe ${c.safe || "—"} · timelock ${c.timelock || "—"}${found}`);
        sink.append(pins);
      }
      if (r.errors.length > 0) sink.append(vaultBanner("error", r.errors.join(" · ")));
      if (r.warnings.length > 0) sink.append(vaultBanner("drift", r.warnings.join(" · ")));
      const row = (x) => {
        const rr = el("div", `own-row own-${x.label}`);
        const id = typeof x.vault === "string" && x.vault ? x.vault : "(unnamed vault)";
        rr.append(el("div", "own-role", id));
        const ac = el("div", "own-ac");
        if (typeof x.owner === "string" && x.owner) {
          ac.append(addrNode("own-addr", x.owner, net));
        } else {
          ac.append(el("span", "own-addr own-missing", "—"));
        }
        rr.append(ac);
        const pills = el("div", "own-prov");
        pills.append(el("span", `own-status own-status-${x.label}`, x.label));
        const cert = x.certificationExpired === true
          ? ["expired", "cert expired"]
          : x.certificationExpired === false
          ? ["current", "cert current"]
          : ["unknown", "cert unknown"];
        pills.append(el("span", `own-status own-cert-${cert[0]}`, cert[1]));
        if (x.pinned === false) pills.append(el("span", "own-status own-status-notpinned", "not pinned"));
        if (x.onChain === false) pills.append(el("span", "own-status own-status-notonchain", "not on-chain"));
        rr.append(pills);
        return rr;
      };
      const clean = (x) =>
        x.label === "timelock" && x.certificationExpired === false &&
        x.pinned !== false && x.onChain !== false;
      const flagged = r.known.filter((x) => !clean(x));
      if (flagged.length > 0) {
        const tbl = el("div", "own-table");
        for (const x of flagged) tbl.append(row(x));
        sink.append(tbl);
      }
      const ok = r.known.filter(clean);
      if (ok.length > 0) {
        const d = el("details", "vault-clean");
        d.append(el("summary", null, `${ok.length} on the timelock with current certification`));
        const tbl = el("div", "own-table");
        for (const x of ok) tbl.append(row(x));
        d.append(tbl);
        sink.append(d);
      }
    }
  };

  const GRANT_COPY = {
    authoriser: {
      title: "Authoriser role grants — who can move value",
      read: "the same map the on-chain invariants assert",
      action: [
        "Action roles — who can move value",
        "Deposit / withdraw / certify and anything else the map grants directly. These are the keys used day to day.",
      ],
      admin: [
        "Admin roles — who can grant and revoke",
        "The <ROLE>_ADMIN half of the same map: the authority to hand the action roles out. Read off the role name, not a list kept here.",
      ],
    },
    orchestrator: {
      title: "Orchestrator role grants — who can mint, burn and recover",
      read: "the expected holders on the orchestrator instance",
      action: [
        "Action roles — who can mint, burn and recover",
        "Mint / burn, and the emergency recovery ops kept on a separate key so it can never also mint.",
      ],
      admin: [
        "Admin role — who can grant and revoke",
        "The role that administers every other orchestrator role.",
      ],
    },
  };
  const renderGrants = (g) => {
    if (!g || !Array.isArray(g.grantees) || g.grantees.length === 0) return;
    const contract = g.contract === "orchestrator" ? "orchestrator" : "authoriser";
    const copy = GRANT_COPY[contract];
    sink.append(el("h2", null, copy.title));
    const gsub = el("div", "own-sub");
    gsub.append("Every (role, grantee) pair pinned in ");
    gsub.append(
      link(
        "",
        `${String(g.source || "").split("/").pop().replace(/\.sol$/, "")}.${g.function}`,
        `https://github.com/${g.org}/${g.repo}/blob/main/${g.source}`,
      ),
    );
    gsub.append(
      ` — ${copy.read} — read back per chain with hasRole() on the ${contract}. ` +
        `The list is DERIVED from that map: a signer added there appears here, and one removed disappears, ` +
        `with no change to this page. It shows current production only — a revoked grantee is not kept as history, ` +
        `because a key on this screen reads as a key that can still act.`,
    );
    sink.append(gsub);
    const pinned = g.pinnedCount ?? 0;
    // A map that parsed short would otherwise read as a smaller map, and every
    // count under it would be quietly measured against the wrong denominator.
    if (typeof g.declaredCount === "number" && g.declaredCount > pinned) {
      sink.append(
        el(
          "div",
          "own-verify own-verify-drift",
          `${g.declaredCount} grants declared in ${g.function}, ${pinned} parsed — the pinned map read here is INCOMPLETE, so every count below is drawn from a partial list.`,
        ),
      );
    }
    // The expectations this chain does not meet, listed.
    //
    // A count ("7 not provisioned") tells a reader how many without telling
    // them which, and any sentence explaining WHY is a sentence about whatever
    // rollout happens to be in flight — it goes stale the moment that rollout
    // lands and says nothing about the next one. An expectation is durable: the
    // map declares that an address should hold a role, the chain is read, and
    // either it does or it does not. That holds for this migration, the next
    // one, and for drift that no migration caused.
    //
    // So: name the role, the address expected to hold it, and what was found
    // instead. No narrative.
    // The Safe still holding an admin role is a violated expectation of its
    // own, not a footnote on a different one. A migration grants the role to
    // the timelock AND has the Safe renounce it; if only the grant lands, every
    // declared grant is in place and the Safe can still grant and revoke at
    // will. The list comes from the chain row rather than being re-derived from
    // the grantees, so the banner's wording and the row below it cannot
    // disagree about how many there are.
    const keptBySafe = (c) => (Array.isArray(c.safeKept) ? c.safeKept : []);

    const violations = {};
    for (const gr of g.grantees || []) {
      for (const r of gr.roles || []) {
        for (const rc of r.chains || []) {
          if (rc.status !== "missing") continue;
          (violations[rc.network] = violations[rc.network] || []).push({
            role: r.role,
            who: gr.ident || "the declared holder",
            // The address too. The grantee's name alone is a label pointing at
            // nothing from here: its address is rendered against it in the
            // Admin-roles table far below, which is no help while reading the
            // violation. Carried per chain because a holder's address differs
            // by chain, and shown once per holder rather than once per role.
            expected: rc.address,
            // `safeHolds` is the one alternative holder the scan probes today.
            // `null` means it was not probed, which is NOT evidence of absence
            // and must not read as "nobody has it".
            heldBySafe: rc.safeHolds === true,
            unprobed: rc.safeHolds !== true && rc.safeHolds !== false,
          });
        }
      }
    }

    // One banner per chain, with the violated expectations listed under it.
    // Amber, not red: an expectation the chain does not meet is a thing to see
    // and act on, and this page does not know whether the cause is a rollout in
    // flight or drift. Asserting which would be guessing. Only an unreadable
    // chain is dimmed, and it says why.
    for (const c of g.chains || []) {
      const st = c.state || "unknown";
      const kept = keptBySafe(c);
      // Every declared grant can be in place while the Safe still holds what it
      // was supposed to give up, so a green banner has to answer to `safeKept`
      // as well as to the tally. `state` is a verdict on the declared grants
      // alone and stays that way.
      const cls = st === "unknown"
        ? "down"
        : st === "live" && kept.length === 0
        ? "ok"
        : "roll";
      const keptClause = kept.length
        ? `the Safe still holds ${kept.length} it should not`
        : null;
      // A partial chain's remainder is made of two DIFFERENT things, and
      // reporting only the provisioning half prints "0 not provisioned" over a
      // grant that was never read — the exact conflation this section exists to
      // prevent, restated as a count. Each part is named only when non-zero.
      const rest = [
        c.missing ? `${c.missing} expectation${c.missing === 1 ? "" : "s"} not met` : null,
        c.unknown ? `${c.unknown} could not be read` : null,
        keptClause,
      ].filter(Boolean).join(", ");
      const msg = st === "live" && kept.length === 0
        ? `${c.network} — all ${c.total} expectations met.`
        : st === "live"
        ? `${c.network} — all ${c.total} declared grants in place, but ${keptClause}.`
        : st === "partial"
        ? `${c.network} — ${c.granted} of ${c.total} expectations met; ${rest}.`
        : st === "unprovisioned"
        ? `${c.network} — none of the ${c.total} expectations are met; ${rest}.`
        : `${c.network} — pinned grants could not be read${
          !c.target
            ? ` (no ${contract} pinned for this chain yet)`
            : !c.rpcHost
            ? " (no RPC endpoint configured for this chain)"
            : " (the on-chain read did not answer)"
        }; unread, not revoked.`;
      const b = el("div", `own-verify own-verify-${cls}`);
      b.append(el("span", "own-verify-msg", msg));
      if (c.target) {
        const src = el("span", "own-verify-src");
        src.append(`${contract} `);
        src.append(addrNode("own-addr", c.target, c.network));
        b.append(src);
      }
      if (c.rpcHost) b.append(el("span", "own-verify-src", `via ${c.rpcHost}`));
      sink.append(b);
      // The violated expectations, grouped by the address that was expected to
      // hold them. One row per expected holder, not per role: the same address
      // repeated down seven rows is noise, and it would render that address
      // seven times where the rest of this page renders each address once.
      const byHolder = new Map();
      for (const v of violations[c.network] || []) {
        // `unprobed` is NOT "nobody" — no other holder was asked about, so
        // claiming absence would assert more than was read. Grouping on it
        // keeps the three findings distinct.
        const found = v.heldBySafe ? "safe" : v.unprobed ? "unread" : "none";
        const key = `${v.who}|${v.expected}|${found}`;
        if (!byHolder.has(key)) {
          byHolder.set(key, { who: v.who, expected: v.expected, found, roles: [] });
        }
        byHolder.get(key).roles.push(v.role);
      }
      for (const grp of byHolder.values()) {
        const row = el("div", "viol");
        const want = el("span", "viol-want");
        want.append(`${grp.who} `);
        if (grp.expected) want.append(addrNode("own-addr", grp.expected, c.network));
        want.append(" should hold");
        row.append(want);
        row.append(el("span", "viol-role", grp.roles.join(", ")));
        row.append(
          el(
            "span",
            "viol-got",
            grp.found === "safe"
              ? "— it does not; the chain's Safe does"
              : grp.found === "unread"
              ? "— it does not; no other holder was read"
              : "— it does not, nor does the chain's Safe",
          ),
        );
        sink.append(row);
      }
      // Stated as what the chain should look like rather than as a step that
      // did not run: "renounce" would name one migration's mechanism, and this
      // line has to read the same way for drift that no migration caused.
      const stillSafe = kept;
      if (stillSafe.length) {
        const row = el("div", "viol");
        const want = el("span", "viol-want");
        want.append("the chain's Safe ");
        if (c.safe) want.append(addrNode("own-addr", c.safe, c.network));
        want.append(" should NOT hold");
        row.append(want);
        row.append(el("span", "viol-role", stillSafe.join(", ")));
        row.append(el("span", "viol-got", "— it still does"));
        sink.append(row);
      }
    }
    const chainChip = (c) => {
      const st = c.status || "unknown";
      const m = {
        granted: ["yes", "✓"],
        missing: ["roll", "○"],
      }[st] || ["dim", "?"];
      // The suffix answers "then who HAS it?", which is a question only a
      // MISSING row raises. An admin role the declared holder does not have
      // yet, that the SAFE does, is a migration still to run — not an unheld
      // privilege; and `safeHolds === false` there means nobody we pinned holds
      // it.
      //
      // On a GRANTED row neither reading survives. The declared holder has it,
      // so `unheld` would be false on its face — a green tick reading
      // "base ✓ unheld" over a role the timelock correctly holds, which is what
      // this said while the Safe was probed on granted rows too. The one thing
      // left worth saying there is that the Safe ALSO has it, so the chip does
      // not read as clean while a violated expectation sits above it.
      const held = st === "granted"
        ? (c.safeHolds === true ? " +safe" : "")
        : c.safeHolds === true
        ? " safe"
        : c.safeHolds === false
        ? " unheld"
        : "";
      return el("span", `own-chip own-chip-${m[0]}`, `${c.network} ${m[1]}${held}`);
    };
    // The addresses a grantee was actually checked at, keyed BY ADDRESS: a
    // service key is one address covering every chain, while the Safe slot is a
    // per-chain deploy artifact and a single address there would be wrong on
    // every chain but one. Keying by chain instead would print the service key's
    // one address once per chain, which reads as two different keys.
    const addressesOf = (gr) => {
      const byAddr = new Map();
      for (const r of gr.roles || []) {
        for (const c of r.chains || []) {
          if (!c.address) continue;
          if (!byAddr.has(c.address)) byAddr.set(c.address, []);
          const nets = byAddr.get(c.address);
          if (!nets.includes(c.network)) nets.push(c.network);
        }
      }
      return [...byAddr].map(([address, networks]) => ({ address, networks }));
    };
    const section = (title, note, isAdmin) => {
      const rows = (g.grantees || [])
        .map((gr) => [gr, (gr.roles || []).filter((r) => !!r.admin === isAdmin)])
        .filter(([, roles]) => roles.length > 0);
      if (!rows.length) return;
      sink.append(el("h3", "tok-h3", title));
      sink.append(el("div", "own-sub", note));
      const table = el("div", "own-table");
      for (const [gr, roles] of rows) {
        const row = el("div", "own-row");
        const rc = el("div", "own-rc");
        // The constant's own name, so a row greps straight back to the line in
        // the deploy repo that put this key on the page.
        rc.append(el("div", "own-role", gr.ident));
        rc.append(
          el(
            "div",
            "own-note",
            gr.kind === "safe"
              ? "the chain's token-owner Safe — cold multisig, holds these directly"
              : gr.kind === "admin-holder"
              ? "the chain's governance timelock — every proposal waits out its delay before it can execute"
              : "service key pinned in the grant map — hot single signer",
          ),
        );
        const addrs = addressesOf(gr);
        for (const a of addrs) {
          const line = el("div", "grt-addr");
          // The chain tag is only meaningful where the addresses DIFFER by
          // chain; on a single address it would imply a per-chain key.
          if (addrs.length > 1) {
            for (const n of a.networks) line.append(el("span", "own-net", n));
          }
          line.append(
            addrNode("own-addr", a.address, a.networks[0]),
          );
          rc.append(line);
        }
        if (!addrs.length) {
          rc.append(el("div", "own-addr own-missing", "— not found"));
        }
        const detail = el("div", "bcn-detail");
        let live = 0, total = 0;
        for (const r of roles) {
          const line = el("div", "bcn-line");
          line.append(el("span", "grt-role", r.role));
          // The id the chain stores, which is what a bundle's calldata carries:
          // a reviewer reading a `grantRole` word needs the name beside the 32
          // bytes, and hashing the name by hand to get there is the step this
          // removes. Absent on older scan output, so the column is conditional
          // rather than rendering an empty slot.
          if (r.roleId) line.append(el("span", "grt-roleid", r.roleId));
          for (const c of r.chains || []) {
            total += 1;
            if (c.status === "granted") live += 1;
            line.append(chainChip(c));
          }
          detail.append(line);
        }
        // With no chains resolved there is nothing to be live ON, and `0/0 live`
        // in green would read as verified — the same "unread looks confirmed"
        // reading this section refuses everywhere else.
        const cls = total === 0
          ? "dim"
          : live === total
          ? "yes"
          : live === 0
          ? "dim"
          : "roll";
        row.append(
          rc,
          detail,
          el(
            "span",
            `own-chip own-chip-${cls}`,
            total === 0 ? "not checked" : `${live}/${total} live`,
          ),
        );
        table.append(row);
      }
      sink.append(table);
    };
    section(copy.action[0], copy.action[1], false);
    section(copy.admin[0], copy.admin[1], true);
  };
  // Role changes: every grant and revoke, and who holds each role now, per
  // contract per network, read from the deploy repo's RBAC subgraph WHEN THE
  // PAGE LOADS. The subgraph is the producer; the scan only says where each
  // network's index is published and which role ids it knows names for, so
  // what is shown is the index as it is now, not as it was at scan time.
  //
  // Each network's index is its own source with its own state, and the state
  // is the first thing said about it. An index still syncing has a complete
  // history only up to its own block; one that is not published, not reachable
  // or erroring has none at all. Rendering any of those as a short list would
  // read as "nothing changed", which is the claim this section exists to make
  // only when it is true.
  const RBAC_KINDS = {
    AUTHORIZER: "Authoriser",
    GOVERNANCE_TIMELOCK: "Governance timelock",
    ORCHESTRATOR: "Orchestrator",
  };
  // How far the newest indexed block's time may trail the viewer's clock and
  // still read as current. A live index trails the chain by seconds; past this
  // it has not reached the present, and its history is complete only up to
  // its own block.
  const RBAC_FRESH_SECS = 600;
  // Rows per GraphQL page (graph-node's cap on `first`), and the pages read per
  // entity before the read is abandoned as incomplete rather than shown short.
  const RBAC_PAGE = 1000;
  const RBAC_MAX_PAGES = 100;
  // The exact body Ormi returns for a name/tag it does not host — the string
  // rainix's `ormi-probe` treats as "missing".
  const RBAC_MISSING = "subgraph name/version error";
  // One GraphQL POST, classified: { data } | { missing } | { error } | { unreachable }.
  const rbacAsk = async (url, query) => {
    let r;
    try {
      r = await io.fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ query }),
        cache: "no-store",
      });
    } catch {
      return { unreachable: true };
    }
    // A non-2xx answer was received, so it is never "unreachable"; its status
    // is what says what went wrong when the body has no GraphQL shape.
    const status = r.ok === false ? `the endpoint answered HTTP ${r.status}` : null;
    let body;
    try {
      body = await r.json();
    } catch {
      return status ? { error: status } : { unreachable: true };
    }
    if (!body || typeof body !== "object") return { error: status || "the endpoint answered with something that is not a JSON object" };
    // `errors` beside `data` is a failure, not a partial answer.
    if ("errors" in body) {
      const errs = Array.isArray(body.errors) ? body.errors : [body.errors];
      return {
        error: errs
          .map((e) => (e && typeof e.message === "string" ? e.message : JSON.stringify(e)))
          .join("; "),
      };
    }
    if ("error" in body) {
      if (body.error === RBAC_MISSING) return { missing: true };
      return { error: typeof body.error === "string" ? body.error : JSON.stringify(body.error) };
