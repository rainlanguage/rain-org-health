<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rain org health — pipeline</title>
<style>
  :root {
    --bg: #fdfcfb; --surface: #f6f4f1; --surface-2: #eeebe6;
    --ink: #201d1a; --ink-2: #5c574f; --ink-3: #8a847a;
    --border: #e7e2da; --accent: #2563eb;
    --debt: #b45309; --debt-bg: #fef3e2; --debt-border: #f5d9ae;
    --clean: #15803d; --clean-bg: #e7f5ec;
    --bar: #b45309; --bar-track: #eeebe6;
    --crit: #dc2626; --pm-fill: rgba(32,29,26,0.07); --pm-fill-deg: rgba(220,38,38,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --surface: #1f1d16; --surface-2: #27241b;
      --ink: #ece8e0; --ink-2: #aaa79c; --ink-3: #706c62;
      --border: #332f24; --accent: #60a5fa;
      --debt: #fbbf24; --debt-bg: #2a220f; --debt-border: #4a3c17;
      --clean: #4ade80; --clean-bg: #12241a;
      --bar: #d98a2b; --bar-track: #27241b;
      --crit: #f87171; --pm-fill: rgba(236,232,224,0.07); --pm-fill-deg: rgba(248,113,113,0.18);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16150f; --surface: #1f1d16; --surface-2: #27241b;
    --ink: #ece8e0; --ink-2: #aaa79c; --ink-3: #706c62;
    --border: #332f24; --accent: #60a5fa;
    --debt: #fbbf24; --debt-bg: #2a220f; --debt-border: #4a3c17;
    --clean: #4ade80; --clean-bg: #12241a;
    --bar: #d98a2b; --bar-track: #27241b;
    --crit: #f87171; --pm-fill: rgba(236,232,224,0.07); --pm-fill-deg: rgba(248,113,113,0.18);
  }
  :root[data-theme="light"] {
    --bg: #fdfcfb; --surface: #f6f4f1; --surface-2: #eeebe6;
    --ink: #201d1a; --ink-2: #5c574f; --ink-3: #8a847a;
    --border: #e7e2da; --accent: #2563eb;
    --debt: #b45309; --debt-bg: #fef3e2; --debt-border: #f5d9ae;
    --clean: #15803d; --clean-bg: #e7f5ec;
    --bar: #b45309; --bar-track: #eeebe6;
    --crit: #dc2626; --pm-fill: rgba(32,29,26,0.07); --pm-fill-deg: rgba(220,38,38,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--ink-3); font-size: 13px; }
  .theme-btn {
    margin-left: auto; background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
    font-size: 13px; cursor: pointer;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 24px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .n { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .tile .l { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
       margin: 32px 0 12px; font-weight: 600; }
  .summary { display: grid; gap: 6px; }
  .srow {
    display: grid; grid-template-columns: 220px 1fr 34px; align-items: center; gap: 12px;
    background: none; border: 0; padding: 4px 6px; border-radius: 8px; cursor: pointer;
    color: inherit; font: inherit; text-align: left; width: 100%;
  }
  .srow:hover { background: var(--surface); }
  .srow.active { background: var(--surface-2); }
  .srow .sig { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ink-2);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow.active .sig { color: var(--ink); font-weight: 600; }
  .track { height: 12px; background: var(--bar-track); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); border-radius: 4px; min-width: 3px; }
  .srow .c { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); text-align: right; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0 8px; }
  input[type=search] {
    flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 11px; color: var(--ink); font-size: 14px;
  }
  .clearf { background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
            border-radius: 8px; padding: 7px 11px; font-size: 13px; cursor: pointer; display: none; }
  .clearf.show { display: inline-block; }
  .repo { border-bottom: 1px solid var(--border); padding: 12px 4px; display: grid;
          grid-template-columns: 240px 1fr; gap: 14px; align-items: start; }
  .repo:last-child { border-bottom: 0; }
  .repo a { color: var(--ink); font-weight: 600; text-decoration: none; font-size: 14.5px; word-break: break-word; }
  .repo a:hover { color: var(--accent); text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--debt-bg); color: var(--debt); border: 1px solid var(--debt-border);
    border-radius: 6px; padding: 2px 8px; cursor: pointer;
  }
  .chip::before { content: "▲"; font-size: 9px; }
  .chip.dim { opacity: 0.32; }
  .clean { display: inline-flex; align-items: center; gap: 6px; color: var(--clean); font-size: 13px; }
  .clean::before { content: "✓"; font-weight: 700; }
  .empty { color: var(--ink-3); padding: 24px 4px; }
  .pm-chart-wrap { position: relative; background: var(--surface); border: 1px solid var(--border);
                   border-radius: 12px; padding: 16px 16px 8px; }
  .pm-chart { width: 100%; height: auto; display: block; overflow: visible; }
  .pm-chart text { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
  .pm-axis-line { stroke: var(--border); stroke-width: 1; }
  .pm-area { fill: var(--pm-fill); stroke: none; }
  .pm-area.deg { fill: var(--pm-fill-deg); }
  .pm-line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .pm-line.deg { stroke: var(--crit); }
  .pm-dot { fill: var(--ink); }
  .pm-dot.deg { fill: var(--crit); stroke: var(--surface); stroke-width: 1.5; }
  /* Qualified with .pm-chart so it outweighs `.pm-chart text` (0,1,1) — an
     unqualified .pm-endlabel (0,1,0) loses the cascade and renders muted. */
  .pm-chart text.pm-endlabel { fill: var(--ink); font-weight: 700; font-size: 11px; }
  .pm-cursor { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .pm-tip { position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -100%);
            background: var(--ink); color: var(--bg); border-radius: 8px; padding: 7px 9px;
            font-size: 11.5px; line-height: 1.5; white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.22); z-index: 5; transition: opacity .08s; }
  .pm-tip .deg { color: var(--crit); font-weight: 700; }
  .pm-empty { color: var(--ink-3); padding: 26px 4px; }
  .pm-note { color: var(--ink-3); font-size: 12px; margin: 10px 2px 0; line-height: 1.5; }
  .pm-note a { color: var(--ink-3); }
  .pm-note .deg { color: var(--crit); font-weight: 600; }
  .pm-controls { display: flex; justify-content: flex-end; margin: 0 2px 10px; }
  .pm-toggle { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--border);
               border-radius: 8px; padding: 2px; }
  .pm-toggle button { background: none; border: 0; color: var(--ink-2); font: inherit; font-size: 12.5px;
                      padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .pm-toggle button.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  /* ---- Pipeline FSM conformance ---- */
  .fsm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 10px; margin: 12px 0; }
  .fsm-state { text-align: left; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border);
               border-radius: 11px; padding: 12px 14px; cursor: pointer; color: inherit; font: inherit; width: 100%; }
  .fsm-state:hover { background: var(--surface-2); }
  .fsm-state.sel { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }
  .fsm-state.flow { border-left-color: var(--clean); }
  .fsm-state.rule { border-left-color: var(--accent); }
  .fsm-state.blk { border-left-color: var(--debt); }
  .fsm-state.zero { opacity: 0.5; }
  /* Theory-of-Constraints bottleneck flag (#32): a state whose inventory is trending
     UP over the trailing 7d gets a red WARNING border (semantic --crit, legible in
     both themes) — placed after the kind rules so it wins the border-color cascade.
     Never color-alone: it is paired with a ▲ badge + title/aria-label. */
  .fsm-state.rising { border-color: var(--crit); box-shadow: inset 0 0 0 1px var(--crit); }
  /* Per-actor FALLBACK emphasis: the largest non-zero queue in a group that flagged no
     bottleneck. Deliberately quieter and semantically distinct from `.rising` — a neutral
     ink ring, no red, and no border-color change (the kind's left edge survives), because
     "this is your biggest pile" must never read as "this is getting worse". Never
     color-alone either: paired with a ▸ badge + title/aria-label. */
  .fsm-state.lead { box-shadow: inset 0 0 0 1px var(--ink-3); }
  .fsm-scrow { display: flex; align-items: center; gap: 8px; }
  /* Inventory sparkline: a recessive thin line + one emphasized endpoint dot, styled
     via theme tokens so it reads in light and dark; it echoes --crit on a rising state. */
  .fsm-spark { display: block; flex: none; overflow: visible; }
  .fsm-spark .sl { fill: none; stroke: var(--ink-3); stroke-width: 1.25; stroke-linejoin: round; stroke-linecap: round; }
  .fsm-spark .sd { fill: var(--ink); stroke: var(--surface); stroke-width: 1; }
  .fsm-state.rising .fsm-spark .sl { stroke: var(--crit); }
  .fsm-state.rising .fsm-spark .sd { fill: var(--crit); }
  .fsm-rise { color: var(--crit); font-size: 12px; font-weight: 700; line-height: 1; }
  .fsm-lead { color: var(--ink-3); font-size: 12px; font-weight: 700; line-height: 1; }
  .fsm-state .sc { font-size: 23px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .fsm-state .sk { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .fsm-state .sa { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); margin-top: 3px; }
  .fsm-list { margin: 18px 0 4px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: none; }
  .fsm-list.open { display: block; }
  .fsm-list .li { display: block; padding: 9px 13px; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--ink); font-size: 13.5px; }
  .fsm-list .li:last-child { border-bottom: 0; }
  .fsm-list .li:hover { background: var(--surface); }
  .fsm-list .li .lr { color: var(--ink-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .fsm-list .li .lz { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .fsm-list .fsm-dh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 13px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .fsm-list .fsm-dh .dhl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-2); }
  .fsm-list .fsm-dh .dhc { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .fsm-list .empty { padding: 12px 13px; }
  .fsm-note { color: var(--ink-3); font-size: 12px; margin: 8px 2px 0; line-height: 1.5; }
  .fsm-note a, .fsm-note code { color: var(--ink-3); }
  .fsm-lane { margin: 14px 0 2px; }
  .fsm-lane-h { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
  .fsm-lane-h .lct { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 650; text-transform: none; letter-spacing: 0; }
  .fsm-lane-h .lsub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-3); text-transform: none; letter-spacing: 0; margin-left: -4px; }
  .fsm-lane .fsm-grid { margin: 0; }
  /* ---- External (Protofire) audit coverage ---- */
  .au-alarm { display: flex; align-items: center; gap: 14px; border-radius: 12px; padding: 14px 18px; margin: 12px 0; }
  .au-alarm.bad { background: var(--debt-bg); border: 1.5px solid var(--crit); }
  .au-alarm.ok { background: var(--clean-bg); border: 1px solid var(--clean); }
  .au-alarm .an { font-size: 32px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
  .au-alarm.bad .an { color: var(--crit); }
  .au-alarm.ok .an { color: var(--clean); }
  .au-alarm .atxt { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
  .au-alarm .atxt b { color: var(--ink); }
  .au-table { border: 1px solid var(--border); border-radius: 11px; overflow: hidden; margin: 4px 0 2px; }
  .au-row { display: grid; grid-template-columns: 230px 84px 1fr; gap: 14px; align-items: start;
            padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .au-row:last-child { border-bottom: 0; }
  .au-row.stale { background: var(--debt-bg); }
  .au-repo a { color: var(--ink); font-weight: 600; text-decoration: none; font-size: 14px; word-break: break-word; }
  .au-repo a:hover { color: var(--accent); text-decoration: underline; }
  .au-sub { color: var(--ink-3); font-size: 12px; margin-top: 3px; line-height: 1.5;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
  .au-flag { display: inline-block; font-size: 11px; color: var(--debt); border: 1px solid var(--debt-border);
             background: var(--debt-bg); border-radius: 5px; padding: 0 5px; margin-top: 3px; font-family: inherit; }
  .au-status { display: inline-flex; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
               font-weight: 650; border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
  .au-status.stale { color: var(--crit); border: 1px solid var(--crit); background: transparent; }
  .au-status.current { color: var(--clean); border: 1px solid var(--clean); background: transparent; }
  .au-status.na { color: var(--ink-3); border: 1px solid var(--border); background: transparent; }
  .au-drift { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
  .au-drift .add { font-weight: 650; color: var(--clean); font-variant-numeric: tabular-nums; }
  .au-drift .del { font-weight: 650; color: var(--crit); font-variant-numeric: tabular-nums; }
  .au-drift .dim { color: var(--ink-3); }
  .au-drift .ok { color: var(--clean); }
  .au-drift a.au-drift-link { color: var(--ink-2); text-decoration: none; cursor: pointer; }
  .au-drift a.au-drift-link:hover { text-decoration: underline; }
  .au-gap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .au-gapchip { font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                color: var(--ink-2); background: var(--surface); border: 1px solid var(--border);
                border-radius: 6px; padding: 2px 8px; text-decoration: none; }
  .au-gapchip:hover { color: var(--accent); border-color: var(--accent); }
  .au-toggle { background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
               border-radius: 8px; padding: 6px 11px; font-size: 13px; cursor: pointer; margin: 4px 0; }
  .au-note { color: var(--ink-3); font-size: 12px; margin: 10px 2px 0; line-height: 1.5; }
  .au-note code { color: var(--ink-3); }
  .au-subhead { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
                margin: 20px 0 6px; font-weight: 600; }
  footer { margin-top: 40px; color: var(--ink-3); font-size: 12px; }
  footer a { color: var(--ink-3); }
  @media (max-width: 620px) {
    .srow { grid-template-columns: 130px 1fr 30px; }
    .repo { grid-template-columns: 1fr; gap: 8px; }
  }
  .nav { display: flex; flex-wrap: wrap; gap: 2px; margin: 14px 0 6px; border-bottom: 1px solid var(--border); }
  .nav a { padding: 8px 13px; color: var(--ink-2); text-decoration: none; font-size: 13.5px;
           border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .nav a:hover { color: var(--ink); }
  .nav a.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>rain org health</h1>
    <span class="meta" id="meta">loading…</span>
    <button class="theme-btn" id="theme" aria-label="Toggle theme">◐ theme</button>
  </header>
  <nav class="nav">
    <a href="index.html">Overview</a>
    <a href="repositories.html">Repositories</a>
    <a href="audit.html">Audit</a>
    <a href="pipeline.html" class="active">Pipeline</a>
    <a href="metrics.html">Metrics</a>
    <a href="deployments.html">Deployments</a>
  </nav>
  <h2>Pipeline state machine</h2>
  <div id="fsm"><div class="empty" id="fsmempty">loading pipeline state…</div></div>
  <footer>
    Org-health dashboard — status, not severity; identity is the label, not the color.
    <a href="https://github.com/rainlanguage/rain-org-health" rel="noopener noreferrer" target="_blank">source</a>.
  </footer>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
// Theme toggle: default follows the OS; the button stamps data-theme to override.
$("theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
});
// ---- Pipeline FSM: the daily conformance review (README "Pipeline state machine").
// Every open producer PR/issue sits in exactly one modeled ai:* state; the leak
// bucket = PRs with a producer note but no state label, and should trend to zero.
// Consumes health.json's `humanQueue` block (schema == `pr-review-report human-queue --json`).
// All human-queue fields are UNTRUSTED (titles/reasons are attacker-influenceable PR/issue
// content). This panel builds the DOM directly (createElement / textContent / .append / .href),
// matching the rest of the dashboard — so escaping is BY CONSTRUCTION and there is no hand-rolled
// HTML escaper to keep correct at every sink.
function renderFsm(hq, history) {
  const box = $("fsm");
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const SVGNS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  // A link whose href is set via the .href PROPERTY (the DOM escapes it) — never string-built.
  const link = (cls, text, href) => {
    const a = el("a", cls, text);
    a.href = href;
    a.rel = "noopener";
    a.target = "_blank";
    return a;
  };

  box.textContent = "";
  if (!hq || !hq.counts) {
    const empty = el("div", "empty");
    empty.append(
      "Pipeline state not wired yet — populated once ",
      link(null, "the human-queue tool", "https://github.com/rainlanguage/issue-pr-cron/pull/41"),
      " lands and the scan folds it into health.json."
    );
    box.append(empty);
    return;
  }
  const c = hq.counts;
  const urlOf = (it, issue) => `https://github.com/${it.repo}/${issue ? "issues" : "pull"}/${Number(it.number)}`;

  // ---- Theory-of-Constraints flow layer (#32): per-state inventory over time.
  // `history` = the parsed human-queue-history.jsonl rollup ([{t:ms, counts}], one
  // point per refresh). It is OPTIONAL — an older/unfetched history just means no
  // sparklines and no trend borders, never a broken panel.
  const hist = Array.isArray(history) ? history : [];
  // "Now" is the LATEST sample, not wall-clock: a stalled feed must not silently
  // slide the trailing window off the data (and it keeps the render deterministic).
  const now = hist.length ? Math.max(...hist.map((p) => Number(p.t))) : 0;
  // Least-squares slope (items/DAY) over the last 7 days must exceed this to flag a
  // state as an accumulating constraint. A small epsilon absorbs sampling noise and a
  // lone +1 blip (whose regression slope stays well under it) so the border never flaps.
  const RISE_EPS = 0.15;
  const SPARK_DAYS = 28; // the sparkline shows ~4 trailing weeks of inventory shape.
  // A state's inventory series from the rollup: one point per refresh that CARRIED
  // this state's counts key (a key absent from older snapshots ⇒ no point, not a zero).
  const seriesFor = (histKey) => {
    if (!histKey) return [];
    const out = [];
    for (const p of hist) {
      const v = p && p.counts ? p.counts[histKey] : undefined;
      if (v != null && Number.isFinite(Number(v))) out.push({ t: Number(p.t), v: Number(v) });
    }
    out.sort((a, b) => a.t - b.t);
    return out;
  };
  // Built as real SVG nodes (createElementNS + setAttribute) — never markup — matching
  // the rest of the dashboard, so nothing reaching the chart is parsed as markup.
  // A series of ONE sample still draws: its endpoint dot, alone. A newly-emitted counts
  // key legitimately has a single point until refreshes accrue (older snapshots carry no
  // value for it, and seriesFor won't invent zeros), and dropping the chart made that
  // state indistinguishable from one wired to no history key at all — silence, on the
  // metric a reader is most likely to be checking BECAUSE it is new. The lone dot is
  // unambiguous against a flat inventory, which has ≥2 points and so draws a horizontal
  // LINE through that same dot; it grows into a full line as the rollup fills in.
  const sparkline = (series) => {
    const win = now ? series.filter((p) => p.t >= now - SPARK_DAYS * 864e5) : series;
    const pts = win.length ? win : series;
    if (!pts.length) return null;
    const W = 56, H = 16, PAD = 2;
    const ts = pts.map((p) => p.t), vs = pts.map((p) => p.v);
    const tMin = Math.min(...ts), tMax = Math.max(...ts);
    const vMin = Math.min(...vs), vMax = Math.max(...vs);
    const xOf = (t) => tMax === tMin ? W - PAD : PAD + ((t - tMin) / (tMax - tMin)) * (W - 2 * PAD);
    const yOf = (v) => vMax === vMin ? H / 2 : H - PAD - ((v - vMin) / (vMax - vMin)) * (H - 2 * PAD);
    const xy = pts.map((p) => [xOf(p.t), yOf(p.v)]);
    const svg = svgEl("svg", { class: "fsm-spark", width: W, height: H, viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" });
    // One point is a dot, not a line — a single-vertex polyline paints nothing.
    if (xy.length > 1) svg.append(svgEl("polyline", { class: "sl", points: xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ") }));
    const last = xy[xy.length - 1];
    svg.append(svgEl("circle", { class: "sd", cx: last[0].toFixed(1), cy: last[1].toFixed(1), r: 2 }));
    return svg;
  };


  // The full machine, grouped by WHO MUST ACT NEXT (#69). A modeled state is not just
  // a lifecycle phase — it is an INBOX owned by exactly one of three actors: the
  // producer (cron), the vetter (cron), or the human (@thedavidmeister). The top-level
  // headings are those actors, so the panel answers "whose inbox is this in — who do I
  // nudge?" A state that cannot be filed under exactly one actor is a defect (an
  // un-owned inbox stalls its token), so there is deliberately NO fourth "misc" bucket;
  // the four historically dual-owner states are each resolved to one owner in STATES
  // below, with the rationale inline.
  //
  // The tool's `human-queue --json` `lanes` object is still keyed by LIFECYCLE phase
  // (vet-lifecycle / vetter-verdicts / producer-blocked / human-decisions) and is SPARSE
  // (only non-empty states emitted). So each state descriptor carries `lane` = where its
  // { count, prs:[{repo,number,url,title}] } is READ from, independent of `owner` = how
  // it is GROUPED. STATES is the canonical shape — a state absent from the JSON renders
  // zero (dimmed), keeping the machine's whole shape visible. laneItems maps a state key
  // -> its PR list for the click-to-expand detail. (Ownership lives in this map until the
  // tool emits an `owner` per state as the single source of truth — an issue-pr-cron
  // follow-up, which would also split the two dual-owner states called out below.)
  const hasLanes = hq.lanes && typeof hq.lanes === "object";
  const laneItems = new Map();
  const laneState = (lane, state) => (hq.lanes[lane] && hq.lanes[lane][state]) || null;

  const stateBox = (key, label, count, act, kind, series) => {
    const b = el("button", "fsm-state " + kind + (count ? "" : " zero"));
    b.dataset.t = key;
    const scRow = el("div", "fsm-scrow");
    scRow.append(el("div", "sc", String(Number(count))));
    const spark = series ? sparkline(series) : null;
    if (spark) scRow.append(spark);
    // The bottleneck flag: inventory rising over the trailing 7d = the constraint.
    // Red warning border (via `.rising`) PLUS a ▲ badge and title/aria-label, so the
    // signal is never carried by color alone.
    const slope = series && series.length ? sevenDaySlope(series, now) : null;
    if (slope != null && slope > RISE_EPS) {
      b.classList.add("rising");
      const up = el("span", "fsm-rise", "▲");
      up.setAttribute("title", "inventory rising 7d");
      scRow.append(up);
      b.setAttribute("title", "inventory rising over the last 7 days — likely the bottleneck");
      b.setAttribute("aria-label", label + ": inventory rising over the last 7 days (bottleneck)");
    }
    b.append(scRow, el("div", "sk", label), el("div", "sa", act));
    return b;
  };

  // Per-actor FALLBACK emphasis: the bottleneck flag above only fires on a RISING series,
  // and `sevenDaySlope` needs two points inside the 7d window — so an actor whose queues
  // are all flat, or whose counts keys were only just emitted, gets NO highlight at all and
  // the eye has nowhere to land even while that actor is carrying real work. The board's
  // job is "where does this actor look first"; a group with nothing marked answers
  // "nowhere", which is wrong whenever there is work. So when a group flags no bottleneck,
  // mark its LARGEST non-zero queue instead.
  //
  // Deliberately a different signal from `.rising` — a neutral ring + ▸, never the red ▲:
  // "your biggest pile" is not "this is getting worse", and reusing the bottleneck
  // treatment would assert a trend the data does not show. It is a FALLBACK, not an
  // addition: a group that already flags a bottleneck is left alone, because the trend is
  // the better answer to "look here first" when it exists. An all-zero group gets nothing —
  // no work really is nothing to do, and marking an empty queue would be pure noise.
  const markLead = (boxes) => {
    if (boxes.some((x) => x.b.classList.contains("rising"))) return;
    // Strictly-greater keeps the FIRST of equal counts, so STATES order is the tie-break
    // and the pick is stable across renders instead of depending on iteration accidents.
    let lead = null;
    for (const x of boxes) if (x.count > 0 && (!lead || x.count > lead.count)) lead = x;
    if (!lead) return;
    lead.b.classList.add("lead");
    const tip = el("span", "fsm-lead", "▸");
    tip.setAttribute("title", "largest queue for this actor");
    const row = lead.b.querySelector(".fsm-scrow");
    if (row) row.append(tip);
    lead.b.setAttribute("title", "largest queue for this actor — start here");
    lead.b.setAttribute("aria-label", lead.label + ": largest queue for this actor (start here)");
  };

  // Every modeled state → the actor whose inbox it sits in (`owner`), the human-queue
  // `lane` its items live under, the next `act`, and a display `kind` (flow = moving,
  // rule = needs a human ruling, blk = a stuck/rework pile). The four dual-owner
  // resolutions (each defensible against the README FSM's own exit edges):
  //   ai:blocked-deploy → HUMAN  — FSM exit is "human resolves deploy → re-work"; the
  //       producer only DIAGNOSES the failed deploy, the human funds/dispatches it.
  //   ai:blocked-infra  → HUMAN  — README's total-function fallback + a human-gated
  //       state: "human clears infra / models a new state". A producer-fixable infra
  //       blip (retrigger CI) never persists this label; a persisted one is a hand-off.
  //   ai:blocked-on     → HUMAN  — FSM exit is "dependency merges → producer re-works",
  //       and only the human merges a PR, so the human is the mover that unblocks it;
  //       the dependency PR's own work is tracked under the dependency's own token.
  //   human:reject      → PRODUCER — the FSM's SOLE exit is "producer reworks per note →
  //       reworked-reject → re-vet". The human already acted (label + rework note); the
  //       next mover is the producer. (The parked "final reject, no note" case is the
  //       tool-side split human:reject-rework vs human:reject-final — see follow-up.)
  // `hist` = this state's key in the human-queue-history rollup `counts` (which mirrors
  // the snapshot's `counts`), i.e. where its inventory time-series is read from.
  const STATES = [
    // Producer inbox — the producer moves these next.
    { owner: "producer", state: "ai:reject", lane: "vetter-verdicts", hist: "reject", act: "rework per note", kind: "blk" },
    { owner: "producer", state: "ai:relink", lane: "vetter-verdicts", hist: "relink", act: "Closes → Refs", kind: "rule" },
    { owner: "producer", state: "human:reject", lane: "human-decisions", hist: "humanReject", act: "rework per note", kind: "blk" },
    // Producer BACKLOG — open issues with no covering open PR (excl. human-gated / close-candidate):
    // the biggest producer inbox, the untouched work it must turn into PRs. Not a lane state —
    // count from `counts.uncoveredIssues`, items from the top-level `uncoveredIssues` (0 on an older
    // human-queue.json that predates the field). See issue-pr-cron#66. `hist` draws from the
    // refreshes that carried the field — one sample is a lone dot, more fill in the line and
    // (past two inside the 7d window) the trend border; none at all → no spark, never a
    // broken box.
    { owner: "producer", state: "uncoveredIssues", fromCounts: "uncoveredIssues", hist: "uncoveredIssues", act: "open a PR", kind: "flow", label: "untouched (no PR)" },
    // Vetter inbox — the vetter records the next verdict.
    { owner: "vetter", state: "un-vetted", lane: "vet-lifecycle", hist: "unvetted", act: "first vet", kind: "flow" },
    { owner: "vetter", state: "awaiting-re-vet", lane: "vet-lifecycle", hist: "awaitingReVet", act: "head moved · re-vet", kind: "flow" },
    // Close-candidate ISSUES awaiting a vetter verdict (issue-pr-cron#73). Hand-triage of
    // the queue found ~1 in 3 producer flags wrong, so a flag is now JUDGED before it
    // reaches a human — this is that inbox. Not a lane state; count from `counts`.
    { owner: "vetter", state: "closeCandidateUnvetted", fromCounts: "closeCandidateUnvetted", hist: "closeCandidateUnvetted", act: "vet the flag", kind: "flow", label: "ai:close-candidate (unvetted)" },
    // Human inbox — a human merge / ruling / close.
    // FSM CONFORMANCE LEAK, first because it is the loudest: producer PRs carrying a note
    // but no `ai:*` label, so they sit in NO modeled state. This was a banner beside the
    // machine, which read as a footnote and got ignored; but "not modelled" is not an
    // annotation on the machine, it is a condition someone must clear — a human has to
    // classify each one into a real state or extend the machine to cover it. As a state it
    // lands in the human's actionable set, carries its own inventory sparkline, and trips
    // the rising-bottleneck border like any other inbox. It should read ZERO. Not a lane
    // state — count from `counts.leaks`, items from the top-level `leaks` array (which is
    // why the key stays `leak`: itemsFor already resolves it).
    { owner: "human", state: "leak", fromCounts: "leaks", hist: "leaks", act: "model it", kind: "blk", label: "not in any modeled state" },
    { owner: "human", state: "ai:ready", lane: "vetter-verdicts", hist: "ready", act: "merge", kind: "flow" },
    { owner: "human", state: "ai:design", lane: "vetter-verdicts", hist: "design", act: "rule on design Q", kind: "rule" },
    { owner: "human", state: "ai:close-candidate", lane: "vetter-verdicts", hist: "closeCandidatePrs", act: "close PR", kind: "rule", label: "ai:close-candidate (PRs)" },
    { owner: "human", state: "ai:blocked-deploy", lane: "producer-blocked", hist: "blockedDeploy", act: "resolve deploy", kind: "blk" },
    { owner: "human", state: "ai:blocked-infra", lane: "producer-blocked", hist: "blockedInfra", act: "clear infra", kind: "blk" },
    { owner: "human", state: "ai:blocked-on", lane: "producer-blocked", hist: "blockedOn", act: "merge dependency", kind: "blk" },
    { owner: "human", state: "human:design", lane: "human-decisions", hist: "humanDesign", act: "decide", kind: "rule" },
    { owner: "human", state: "human:close-candidate", lane: "human-decisions", hist: "humanCloseCandidate", act: "close", kind: "rule" },
    // Close-candidate ISSUES the vetter UPHELD (issue-pr-cron#73): the flag survived
    // judgement, so a human genuinely has to dispose of it. Rejected flags need no state
    // — the vetter strips the label and they fall back into `uncoveredIssues`.
    // There is deliberately NO combined "all flagged issues" box: one flag now produces
    // TWO inboxes with DIFFERENT owners (unvetted → vetter, upheld → human), so their sum
    // is not a state anyone acts on — it is a number spanning two actors, which is exactly
    // why it could never be added to an actor total. The legacy no-`lanes` branch below
    // still renders `closeCandidateIssues`, because a human-queue.json old enough to lack
    // `lanes` also predates the split keys.
    { owner: "human", state: "closeCandidateUpheld", fromCounts: "closeCandidateUpheld", hist: "closeCandidateUpheld", act: "close issue", kind: "rule", label: "ai:close-candidate (upheld)" },
  ];

  // Top-level headings = the three actors, in the #69 order (the two cron actors, then
  // the human). Each state box carries `data-t` = its state key, so the click-to-expand
  // detail is unchanged by the regrouping.
  const OWNERS = [
    { key: "producer", title: "Producer action", sub: "cron" },
    { key: "vetter", title: "Vetter action", sub: "cron" },
    { key: "human", title: "Human action", sub: "@thedavidmeister" },
  ];

  const grid = el("div"); // container appended into the panel below
  if (hasLanes) {
    OWNERS.forEach((O) => {
      const g = el("div", "fsm-grid");
      let ownerTotal = 0;
      const boxes = [];
      STATES.filter((s) => s.owner === O.key).forEach((s) => {
        let count;
        if (s.fromCounts) {
          count = Number(c[s.fromCounts]) || 0;
        } else {
          const cell = laneState(s.lane, s.state);
          count = cell ? Number(cell.count) || 0 : 0;
          laneItems.set(s.state, (cell && cell.prs) || []);
        }
        ownerTotal += count;
        const label = s.label || s.state;
        const b = stateBox(s.state, label, count, s.act, s.kind, seriesFor(s.hist));
        boxes.push({ b, count, label });
        g.append(b);
      });
      markLead(boxes);
      const lane = el("div", "fsm-lane");
      const h = el("div", "fsm-lane-h");
      h.append(el("span", null, O.title), el("span", "lsub", O.sub), el("span", "lct", String(ownerTotal)));
      lane.append(h, g);
      grid.append(lane);
    });
  } else {
    // Backward-compat: an older human-queue.json with no `lanes` — render the 6 states
    // the legacy `counts` keys carry (all human-owned under the actor mapping) from
    // `counts`, so the panel never blanks.
    const legacy = [
      { key: "leak", label: "not in any modeled state", n: c.leaks, hist: "leaks", act: "model it", kind: "blk" },
      { key: "ai:ready", label: "ai:ready", n: c.ready, hist: "ready", act: "merge", kind: "flow" },
      { key: "ai:design", label: "ai:design", n: c.design, hist: "design", act: "rule on design Q", kind: "rule" },
      { key: "closeCandidateIssues", label: "ai:close-candidate (issues)", n: c.closeCandidateIssues, hist: "closeCandidateIssues", act: "close issue", kind: "rule" },
      { key: "ai:blocked-deploy", label: "ai:blocked-deploy", n: c.blockedDeploy, hist: "blockedDeploy", act: "resolve deploy", kind: "blk" },
      { key: "ai:blocked-infra", label: "ai:blocked-infra", n: c.blockedInfra, hist: "blockedInfra", act: "clear infra", kind: "blk" },
      { key: "ai:blocked-on", label: "ai:blocked-on", n: c.blockedOn, hist: "blockedOn", act: "merge dependency", kind: "blk" },
    ];
    const g = el("div", "fsm-grid");
    const boxes = [];
    legacy.forEach((s) => {
      const b = stateBox(s.key, s.label, s.n, s.act, s.kind, seriesFor(s.hist));
      boxes.push({ b, count: Number(s.n) || 0, label: s.label });
      g.append(b);
    });
    markLead(boxes);
    const lane = el("div", "fsm-lane");
    const h = el("div", "fsm-lane-h");
    h.append(el("span", null, "Human action"), el("span", "lsub", "@thedavidmeister"));
    lane.append(h, g);
    grid.append(lane);
  }

  // itemsFor returns { arr, issue } for a state key: the item list, and whether the
  // items are issues (vs PRs) — which decides the GitHub URL path.
  const itemsFor = (key) => {
    if (key === "leak") return { arr: hq.leaks || [], issue: false };
    if (key === "closeCandidateIssues") return { arr: hq.closeCandidateIssues || [], issue: true };
    if (key === "uncoveredIssues") return { arr: hq.uncoveredIssues || [], issue: true };
    if (laneItems.has(key)) return { arr: laneItems.get(key), issue: false };
    return { arr: (hq.states && hq.states[key]) || [], issue: false };
  };

  // Detail body for a clicked box: a header naming THIS state and its OWN item count
  // (the list length rendered directly below it), so the panel can never read as
  // belonging to another section, then the items.
  const detailBody = (key, label) => {
    const { arr, issue } = itemsFor(key);
    const frag = document.createDocumentFragment();
    const h = el("div", "fsm-dh");
    h.append(el("span", "dhl", label), el("span", "dhc", arr.length + (arr.length === 1 ? " item" : " items")));
    frag.append(h);
    if (!arr.length) {
      frag.append(el("div", "empty", "no items in this state"));
      return frag;
    }
    arr.forEach((it) => {
      const a = link("li", undefined, urlOf(it, issue));
      a.append(el("span", "lr", it.repo + "#" + Number(it.number)), " " + (it.title == null ? "" : it.title));
      if (it.reason) a.append(el("span", "lz", it.reason));
      frag.append(a);
    });
    return frag;
  };

  const note = el("div", "fsm-note");
  note.append(
    "The pipeline is a ",
    link(null, "finite state machine", "https://github.com/rainlanguage/issue-pr-cron/blob/main/README.md"),
    " — every open PR/issue sits in exactly one modeled ",
    el("code", null, "ai:*"),
    " state, grouped here by ",
    el("b", null, "who must act next"),
    " (producer / vetter / human): a state that can't be filed under exactly one actor is an un-owned inbox where tokens stall"
  );
  if (hq.sample) note.append(" ", el("b", null, "(sample data — live once issue-pr-cron#41 lands)"));
  note.append(".");
  if (hist.length) {
    note.append(
      " Each state carries an inventory sparkline (trailing 4 weeks); a ",
      el("b", null, "red border"),
      " marks a state whose inventory is trending up over the last 7 days — the ",
      link(null, "Theory-of-Constraints", "https://github.com/rainlanguage/issue-pr-cron/blob/main/README.md"),
      " bottleneck: rising WIP is where the system is constrained."
    );
  }
  // Deliberately OUTSIDE the `hist` guard: the lead mark is exactly what fills the gap when
  // no trend is computable, so it can appear on a page with no sparklines at all.
  note.append(
    " Where nothing in an actor's group is trending up, a ",
    el("b", null, "▸"),
    " marks that actor's largest queue instead — not a trend, just where to start."
  );

  const detail = el("div", "fsm-list");
  detail.id = "fsmdetail";
  box.append(grid, detail, note);

  // Header label for a clicked box: its own state label (.sk). Every [data-t] is a
  // state box now that the leak banner is a state, so the key is only a defensive
  // fallback.
  const labelOf = (b, k) => {
    const sk = b.querySelector && b.querySelector(".sk");
    return sk && sk.textContent ? sk.textContent : k;
  };

  let openKey = null;
  box.querySelectorAll("[data-t]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.t;
    box.querySelectorAll("[data-t]").forEach((x) => x.classList.remove("sel"));
    if (openKey === k) { detail.classList.remove("open"); openKey = null; return; }
    openKey = k;
    // The detail is a single panel at the bottom of the machine; its header names
    // the selected state (below) and CSS gives it clear vertical separation, so it
    // reads as the clicked state's list rather than an extension of the last lane.
    detail.replaceChildren(detailBody(k, labelOf(b, k)));
    detail.classList.add("open");
    if (b.classList.contains("fsm-state")) b.classList.add("sel");
  }));
}

// Parse the append-only human-queue-history.jsonl rollup (one {ts, counts} per refresh)
// into [{t:ms, counts}] sorted oldest→newest, dropping malformed lines and any with an
// unparseable timestamp. Timestamps are the tool's real refresh/commit times — never
// synthesized here; this only reads them. Kept top-level (not closed over renderFsm) so
// the render can be tested against a plain fixture array.
function parseHistory(text) {
  if (typeof text !== "string" || !text) return [];
  const out = [];
  for (const line of text.split("\n")) {
    const s = line.trim();
    if (!s) continue;
    let o;
    try { o = JSON.parse(s); } catch { continue; }
    if (!o || typeof o !== "object" || !o.counts || typeof o.counts !== "object") continue;
    const t = Date.parse(o.ts);
    if (!Number.isFinite(t)) continue;
    out.push({ t, counts: o.counts });
  }
  out.sort((a, b) => a.t - b.t);
  return out;
}

// Least-squares slope (inventory items per DAY) of a state's WIP over the trailing 7
// days, anchored at nowMs (the latest sample). `series` is [{t:ms, v:count}]. This is
// the Theory-of-Constraints trend that flags the bottleneck: a slope above a small
// epsilon (applied at the call site) = inventory accumulating = the constraint. Returns
// null when the window holds fewer than two distinct-time points — a single point or a
// lone blip can't establish a trend, so it never flags a state on its own.
function sevenDaySlope(series, nowMs) {
  if (!Array.isArray(series) || !series.length) return null;
  const from = nowMs - 7 * 864e5;
  const win = series.filter((p) => p && Number(p.t) >= from && Number(p.t) <= nowMs);
  if (win.length < 2) return null;
  // x in days relative to nowMs; y = inventory. slope = Σ(x-x̄)(y-ȳ) / Σ(x-x̄)².
  const xs = win.map((p) => (Number(p.t) - nowMs) / 864e5);
  const ys = win.map((p) => Number(p.v));
  const n = xs.length;
  const xbar = xs.reduce((a, b) => a + b, 0) / n;
  const ybar = ys.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    num += (xs[i] - xbar) * (ys[i] - ybar);
    den += (xs[i] - xbar) ** 2;
  }
  if (den === 0) return null; // every point shares a timestamp — no trend to fit
  return num / den;
}

// FSM-conformance state is issue-pr-cron's OWN artifact, fetched at runtime like the producer
// metrics below — never baked into this repo or computed here (CLAUDE.md: the dashboard is a
// consumer, not a producer, of data; new data ⇒ new fetch, not new baking). The history
// rollup (per-state inventory over time) is a second artifact fetched the same way; if it is
// missing/older the panel simply renders no sparklines and no trend borders.
const HQ_URL = "https://raw.githubusercontent.com/rainlanguage/issue-pr-cron/main/human-queue.json";
const HIST_URL = "https://raw.githubusercontent.com/rainlanguage/issue-pr-cron/main/human-queue-history.jsonl";
$("meta").textContent = "pipeline conformance · issue-pr-cron";
Promise.all([
  fetch(HQ_URL, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
  fetch(HIST_URL, { cache: "no-store" }).then((r) => (r.ok ? r.text() : "")).catch(() => ""),
]).then(([hq, histText]) => renderFsm(hq, parseHistory(histText)));
</script>
</body>
</html>
