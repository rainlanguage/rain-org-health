<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rain org health — pipeline</title>
<style>
  :root {
    --bg: #fdfcfb; --surface: #f6f4f1; --surface-2: #eeebe6;
    --ink: #201d1a; --ink-2: #5c574f; --ink-3: #8a847a;
    --border: #e7e2da; --accent: #2563eb;
    --debt: #b45309; --debt-bg: #fef3e2; --debt-border: #f5d9ae;
    --clean: #15803d; --clean-bg: #e7f5ec;
    --bar: #b45309; --bar-track: #eeebe6;
    --crit: #dc2626; --pm-fill: rgba(32,29,26,0.07); --pm-fill-deg: rgba(220,38,38,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --surface: #1f1d16; --surface-2: #27241b;
      --ink: #ece8e0; --ink-2: #aaa79c; --ink-3: #706c62;
      --border: #332f24; --accent: #60a5fa;
      --debt: #fbbf24; --debt-bg: #2a220f; --debt-border: #4a3c17;
      --clean: #4ade80; --clean-bg: #12241a;
      --bar: #d98a2b; --bar-track: #27241b;
      --crit: #f87171; --pm-fill: rgba(236,232,224,0.07); --pm-fill-deg: rgba(248,113,113,0.18);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16150f; --surface: #1f1d16; --surface-2: #27241b;
    --ink: #ece8e0; --ink-2: #aaa79c; --ink-3: #706c62;
    --border: #332f24; --accent: #60a5fa;
    --debt: #fbbf24; --debt-bg: #2a220f; --debt-border: #4a3c17;
    --clean: #4ade80; --clean-bg: #12241a;
    --bar: #d98a2b; --bar-track: #27241b;
    --crit: #f87171; --pm-fill: rgba(236,232,224,0.07); --pm-fill-deg: rgba(248,113,113,0.18);
  }
  :root[data-theme="light"] {
    --bg: #fdfcfb; --surface: #f6f4f1; --surface-2: #eeebe6;
    --ink: #201d1a; --ink-2: #5c574f; --ink-3: #8a847a;
    --border: #e7e2da; --accent: #2563eb;
    --debt: #b45309; --debt-bg: #fef3e2; --debt-border: #f5d9ae;
    --clean: #15803d; --clean-bg: #e7f5ec;
    --bar: #b45309; --bar-track: #eeebe6;
    --crit: #dc2626; --pm-fill: rgba(32,29,26,0.07); --pm-fill-deg: rgba(220,38,38,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--ink-3); font-size: 13px; }
  .theme-btn {
    margin-left: auto; background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
    font-size: 13px; cursor: pointer;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 24px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .n { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .tile .l { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
       margin: 32px 0 12px; font-weight: 600; }
  .summary { display: grid; gap: 6px; }
  .srow {
    display: grid; grid-template-columns: 220px 1fr 34px; align-items: center; gap: 12px;
    background: none; border: 0; padding: 4px 6px; border-radius: 8px; cursor: pointer;
    color: inherit; font: inherit; text-align: left; width: 100%;
  }
  .srow:hover { background: var(--surface); }
  .srow.active { background: var(--surface-2); }
  .srow .sig { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ink-2);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow.active .sig { color: var(--ink); font-weight: 600; }
  .track { height: 12px; background: var(--bar-track); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); border-radius: 4px; min-width: 3px; }
  .srow .c { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); text-align: right; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0 8px; }
  input[type=search] {
    flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 11px; color: var(--ink); font-size: 14px;
  }
  .clearf { background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
            border-radius: 8px; padding: 7px 11px; font-size: 13px; cursor: pointer; display: none; }
  .clearf.show { display: inline-block; }
  .repo { border-bottom: 1px solid var(--border); padding: 12px 4px; display: grid;
          grid-template-columns: 240px 1fr; gap: 14px; align-items: start; }
  .repo:last-child { border-bottom: 0; }
  .repo a { color: var(--ink); font-weight: 600; text-decoration: none; font-size: 14.5px; word-break: break-word; }
  .repo a:hover { color: var(--accent); text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--debt-bg); color: var(--debt); border: 1px solid var(--debt-border);
    border-radius: 6px; padding: 2px 8px; cursor: pointer;
  }
  .chip::before { content: "▲"; font-size: 9px; }
  .chip.dim { opacity: 0.32; }
  .clean { display: inline-flex; align-items: center; gap: 6px; color: var(--clean); font-size: 13px; }
  .clean::before { content: "✓"; font-weight: 700; }
  .empty { color: var(--ink-3); padding: 24px 4px; }
  .pm-chart-wrap { position: relative; background: var(--surface); border: 1px solid var(--border);
                   border-radius: 12px; padding: 16px 16px 8px; }
  .pm-chart { width: 100%; height: auto; display: block; overflow: visible; }
  .pm-chart text { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
  .pm-axis-line { stroke: var(--border); stroke-width: 1; }
  .pm-area { fill: var(--pm-fill); stroke: none; }
  .pm-area.deg { fill: var(--pm-fill-deg); }
  .pm-line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .pm-line.deg { stroke: var(--crit); }
  .pm-dot { fill: var(--ink); }
  .pm-dot.deg { fill: var(--crit); stroke: var(--surface); stroke-width: 1.5; }
  /* Qualified with .pm-chart so it outweighs `.pm-chart text` (0,1,1) — an
     unqualified .pm-endlabel (0,1,0) loses the cascade and renders muted. */
  .pm-chart text.pm-endlabel { fill: var(--ink); font-weight: 700; font-size: 11px; }
  .pm-cursor { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .pm-tip { position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -100%);
            background: var(--ink); color: var(--bg); border-radius: 8px; padding: 7px 9px;
            font-size: 11.5px; line-height: 1.5; white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.22); z-index: 5; transition: opacity .08s; }
  .pm-tip .deg { color: var(--crit); font-weight: 700; }
  .pm-empty { color: var(--ink-3); padding: 26px 4px; }
  .pm-note { color: var(--ink-3); font-size: 12px; margin: 10px 2px 0; line-height: 1.5; }
  .pm-note a { color: var(--ink-3); }
  .pm-note .deg { color: var(--crit); font-weight: 600; }
  .pm-controls { display: flex; justify-content: flex-end; margin: 0 2px 10px; }
  .pm-toggle { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--border);
               border-radius: 8px; padding: 2px; }
  .pm-toggle button { background: none; border: 0; color: var(--ink-2); font: inherit; font-size: 12.5px;
                      padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .pm-toggle button.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .wl-sum { color: var(--ink-3); font-size: 13px; margin: 8px 0 10px; }
  .wl { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 28px; }
  .wl-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 13px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .wl-row:last-child { border-bottom: 0; }
  .wl-row .wl-age { flex: none; width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .wl-row .wl-main { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .wl-row .wl-ref { color: var(--ink-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; margin-right: 6px; }
  .wl-row .wl-prs { flex: none; display: flex; gap: 6px; font-size: 12px; }
  .wl-row .wl-none { color: var(--ink-3); }
  .wl a { color: var(--ink); text-decoration: none; }
  .wl a:hover { text-decoration: underline; }
  .wl .wl-prs a { color: var(--accent); }
  .oi-band { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px;
              background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
              padding: 14px 16px; margin: 12px 0 4px; }
  .oi-band .oi-pop { flex: 1 1 230px; min-width: 200px; }
  .oi-band .oi-n { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }
  .oi-band .oi-k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .oi-band .oi-sub { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; margin-top: 4px; }
  .oi-band .oi-cell { display: flex; flex-direction: column; gap: 3px; flex: none; }
  .oi-band .oi-cap { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); }
  .oi-band .oi-ages { display: flex; flex-direction: column; gap: 5px; flex: none; }
  .oi-band .oi-stats { display: grid; gap: 3px; }
  /* mean and median are EQUALS: the same row, the same type size and weight, the same chart
     drawn in the same stroke. Nothing here ranks one above the other — they are told apart
     by their own names, which is the page's rule for identity generally. */
  .oi-band .oi-stat { display: flex; align-items: center; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .oi-band .oi-sn { color: var(--ink-3); min-width: 46px; }
  .oi-band .oi-sv { color: var(--ink); font-weight: 650; min-width: 56px; }
  /* The tail number: visible detail, not a series and not a headline. */
  .oi-band .oi-tail { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .oi-band .oi-chart { display: block; overflow: visible; flex: none; }
  .oi-band .q-l { fill: none; stroke: var(--ink-3); stroke-width: 1.25; stroke-linejoin: round; stroke-linecap: round; }
  .oi-band .q-d { fill: var(--ink); stroke: var(--surface); stroke-width: 1; }
  .oi-band .a-l { fill: none; stroke: var(--ink-3); stroke-width: 1.25; stroke-linejoin: round; stroke-linecap: round; }
  .oi-band .a-d { fill: var(--ink); stroke: var(--surface); stroke-width: 1; }
  /* ---- External (Protofire) audit coverage ---- */
  .au-alarm { display: flex; align-items: center; gap: 14px; border-radius: 12px; padding: 14px 18px; margin: 12px 0; }
  .au-alarm.bad { background: var(--debt-bg); border: 1.5px solid var(--crit); }
  .au-alarm.ok { background: var(--clean-bg); border: 1px solid var(--clean); }
  .au-alarm .an { font-size: 32px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
  .au-alarm.bad .an { color: var(--crit); }
  .au-alarm.ok .an { color: var(--clean); }
  .au-alarm .atxt { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
  .au-alarm .atxt b { color: var(--ink); }
  .au-table { border: 1px solid var(--border); border-radius: 11px; overflow: hidden; margin: 4px 0 2px; }
  .au-row { display: grid; grid-template-columns: 230px 84px 1fr; gap: 14px; align-items: start;
            padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .au-row:last-child { border-bottom: 0; }
  .au-row.stale { background: var(--debt-bg); }
  .au-repo a { color: var(--ink); font-weight: 600; text-decoration: none; font-size: 14px; word-break: break-word; }
  .au-repo a:hover { color: var(--accent); text-decoration: underline; }
  .au-sub { color: var(--ink-3); font-size: 12px; margin-top: 3px; line-height: 1.5;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
  .au-flag { display: inline-block; font-size: 11px; color: var(--debt); border: 1px solid var(--debt-border);
             background: var(--debt-bg); border-radius: 5px; padding: 0 5px; margin-top: 3px; font-family: inherit; }
  .au-status { display: inline-flex; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
               font-weight: 650; border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
  .au-status.stale { color: var(--crit); border: 1px solid var(--crit); background: transparent; }
  .au-status.current { color: var(--clean); border: 1px solid var(--clean); background: transparent; }
  .au-status.na { color: var(--ink-3); border: 1px solid var(--border); background: transparent; }
  .au-drift { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
  .au-drift .add { font-weight: 650; color: var(--clean); font-variant-numeric: tabular-nums; }
  .au-drift .del { font-weight: 650; color: var(--crit); font-variant-numeric: tabular-nums; }
  .au-drift .dim { color: var(--ink-3); }
  .au-drift .ok { color: var(--clean); }
  .au-drift a.au-drift-link { color: var(--ink-2); text-decoration: none; cursor: pointer; }
  .au-drift a.au-drift-link:hover { text-decoration: underline; }
  .au-gap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .au-gapchip { font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                color: var(--ink-2); background: var(--surface); border: 1px solid var(--border);
                border-radius: 6px; padding: 2px 8px; text-decoration: none; }
  .au-gapchip:hover { color: var(--accent); border-color: var(--accent); }
  .au-toggle { background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
               border-radius: 8px; padding: 6px 11px; font-size: 13px; cursor: pointer; margin: 4px 0; }
  .au-note { color: var(--ink-3); font-size: 12px; margin: 10px 2px 0; line-height: 1.5; }
  .au-note code { color: var(--ink-3); }
  .au-subhead { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
                margin: 20px 0 6px; font-weight: 600; }
  footer { margin-top: 40px; color: var(--ink-3); font-size: 12px; }
  footer a { color: var(--ink-3); }
  @media (max-width: 620px) {
    .srow { grid-template-columns: 130px 1fr 30px; }
    .repo { grid-template-columns: 1fr; gap: 8px; }
  }
  .nav { display: flex; flex-wrap: wrap; gap: 2px; margin: 14px 0 6px; border-bottom: 1px solid var(--border); }
  .nav a { padding: 8px 13px; color: var(--ink-2); text-decoration: none; font-size: 13.5px;
           border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .nav a:hover { color: var(--ink); }
  .nav a.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
</style>

<body>
<div class="wrap">
  <header>
    <h1>rain org health</h1>
    <span class="meta" id="meta">loading…</span>
    <button class="theme-btn" id="theme" aria-label="Toggle theme">◐ theme</button>
  </header>
  <nav class="nav">
    <a href="deployments.html">Deployments</a>
    <a href="pipeline.html" class="active">Pipeline</a>
    <a href="audit.html">Audit</a>
    <a href="metrics.html">Metrics</a>
    <a href="repositories.html">Repositories</a>
  </nav>
  <h2>Open issues</h2>
  <div id="kpis"><div class="empty">loading issue KPIs…</div></div>
  <h2>Close next: oldest open issues</h2>
  <div id="worklist"><div class="empty">loading worklist…</div></div>
  <footer>
    Org-health dashboard — status, not severity; identity is the label, not the color.
    <a href="https://github.com/rainlanguage/rain-org-health" rel="noopener noreferrer" target="_blank">source</a>.
  </footer>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
// Theme toggle: default follows the OS; the button stamps data-theme to override.
$("theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
});
// ---- The issue KPIs: how many issues are open, and how old they run.
// Three reads of ONE population — `counts.openIssues` for the size, and `ages.openIssues`'s
// mean / median / oldest for the age — so the number of issues and the age of those issues
// can never describe different sets. Consumes issue-pr-cron's `human-queue --json` snapshot
// and its `human-queue-history.jsonl` rollup; every field is UNTRUSTED, and the DOM is built
// directly (createElement / textContent / .append), so escaping is by construction.
//
// A snapshot with neither the count nor the ages renders NO band rather than a zero: the
// recording side omits both when its read fails, and an org whose issues all closed at once
// is not what that means.
function renderKpis(hq, history) {
  const box = $("kpis");
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const SVGNS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  box.textContent = "";
  const counts = hq && hq.counts && typeof hq.counts === "object" ? hq.counts : {};
  // `history` = the parsed rollup ([{t:ms, counts[, ages]}]). OPTIONAL: an older or
  // unfetched rollup means no trend charts, never a broken band.
  const hist = Array.isArray(history) ? history : [];
  // "Now" is the LATEST sample, not wall-clock: a stalled feed must not silently slide the
  // trailing window off the data (and it keeps the render deterministic).
  const now = hist.length ? Math.max(...hist.map((p) => Number(p.t))) : 0;
  const SPARK_DAYS = 28; // the charts show ~4 trailing weeks.
  // A VALUE off the untrusted artifact: a real JSON number, finite, and >= 0 — or null.
  // Not `Number(x)`: that coerces `null`/`""` to 0, fabricating a "0d" age (or a "0 open
  // issues" population) out of a malformed field.
  const posNum = (x) => (typeof x === "number" && Number.isFinite(x) && x >= 0 ? x : null);
  const ageBlock = (o) => {
    const a = o && typeof o === "object" ? o.openIssues : null;
    return a && typeof a === "object" ? a : null;
  };
  // The open-issue count over the rollup: one point per refresh that carried it, never a
  // zero for one that did not.
  const sizeSeries = () => {
    const out = [];
    for (const p of hist) {
      const v = posNum(p && p.counts ? p.counts.openIssues : null);
      if (v != null) out.push({ t: Number(p.t), v });
    }
    return out.sort((a, b) => a.t - b.t);
  };
  // One age series (days): one point per refresh whose line carried this statistic as a
  // finite number. A refresh without it contributes NO point — absence, never a zero.
  const ageSeries = (field) => {
    const out = [];
    for (const p of hist) {
      const v = posNum((ageBlock(p && p.ages) || {})[field]);
      if (v != null) out.push({ t: Number(p.t), v });
    }
    return out.sort((a, b) => a.t - b.t);
  };
  // The CURRENT statistics: the snapshot's own `ages` when it carries mean or median, else
  // the newest rollup line (by timestamp) that does, else null ⇒ no numbers.
  const ageCur = () => {
    const read = (blk) => {
      const a = ageBlock(blk);
      if (!a) return null;
      const cur = { mean: posNum(a.meanDays), median: posNum(a.medianDays), oldest: posNum(a.oldestDays) };
      return cur.mean == null && cur.median == null ? null : cur;
    };
    const snap = read(hq && hq.ages);
    if (snap) return snap;
    let best = null, bestT = -Infinity;
    for (const p of hist) {
      const h = read(p && p.ages);
      if (h && Number(p.t) >= bestT) { best = h; bestT = Number(p.t); }
    }
    return best;
  };
  // One chart per QUANTITY (size, mean age, median age), each on its OWN min/max: these
  // barely move relative to their level, so a shared or zero-anchored ruler draws them flat.
  // Vertical position therefore means nothing across charts, and each sits beside its own
  // number. All three share ONE time domain, so a late-starting series starts late.
  const PAD = 3;
  const windowed = (s) => {
    const win = now ? s.filter((p) => p.t >= now - SPARK_DAYS * 864e5) : s;
    return win.length ? win : s;
  };
  const xOfFor = (w, tMin, tMax) => (t) =>
    tMax === tMin ? w - PAD : PAD + ((t - tMin) / (tMax - tMin)) * (w - 2 * PAD);
  const yOfFor = (h, vs) => {
    const vMin = Math.min(...vs), vMax = Math.max(...vs);
    return (v) => vMax === vMin ? h / 2 : h - PAD - ((v - vMin) / (vMax - vMin)) * (h - 2 * PAD);
  };
  // An empty series draws NOTHING; one point draws its dot alone.
  const chart = (cls, w, h, xOf, pts, lineCls, dotCls) => {
    if (!pts.length) return null;
    const yOf = yOfFor(h, pts.map((p) => p.v));
    const xy = pts.map((p) => [xOf(p.t), yOf(p.v)]);
    const svg = svgEl("svg", { class: "oi-chart " + cls, width: w, height: h, viewBox: `0 0 ${w} ${h}`, "aria-hidden": "true" });
    if (xy.length > 1) svg.append(svgEl("polyline", { class: lineCls, points: xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ") }));
    const last = xy[xy.length - 1];
    svg.append(svgEl("circle", { class: dotCls, cx: last[0].toFixed(1), cy: last[1].toFixed(1), r: 2 }));
    return svg;
  };
  const fmtD = (v) => String(Math.round(v * 10) / 10).replace(/\.0$/, "") + "d";

  const cur = ageCur();
  const meanPts = windowed(ageSeries("meanDays"));
  const medPts = windowed(ageSeries("medianDays"));
  const sizePts = windowed(sizeSeries());
  const size = posNum(counts.openIssues);
  if (size == null && !sizePts.length && !cur) {
    box.append(el("div", "empty", "No issue KPIs: human-queue.json carries neither the open-issue count nor ages."));
    return;
  }
  const band = el("div", "oi-band");
  const pop = el("div", "oi-pop");
  // No size ⇒ no fabricated number. The ages can arrive on a snapshot whose count did not.
  pop.append(el("div", "oi-n", size == null ? "—" : String(size)));
  pop.append(el("div", "oi-k", "open issues"));
  pop.append(el(
    "div",
    "oi-sub",
    "every open issue in the pipeline's scope outside archived repos, which take no writes — including ones already covered by an open PR, parked on a human ruling, or flagged ai:close-candidate.",
  ));
  band.append(pop);

  const ts = [...sizePts, ...meanPts, ...medPts].map((p) => Number(p.t));
  const tMin = ts.length ? Math.min(...ts) : 0, tMax = ts.length ? Math.max(...ts) : 0;
  const sizeChart = chart("oi-size", 120, 34, xOfFor(120, tMin, tMax), sizePts, "q-l", "q-d");
  if (sizeChart) {
    const cell = el("div", "oi-cell");
    cell.append(sizeChart, el("div", "oi-cap", "queue size · 4 weeks"));
    band.append(cell);
  }
  if (cur) {
    const ages = el("div", "oi-ages");
    const stats = el("div", "oi-stats");
    // mean and median as EQUALS: the same row, built by the same function.
    const stat = (name, v, pts, chartCls) => {
      if (v == null) return;
      const row = el("div", "oi-stat");
      row.append(el("span", "oi-sn", name), el("span", "oi-sv", fmtD(v)));
      const ch = chart(chartCls, 72, 20, xOfFor(72, tMin, tMax), pts, "a-l", "a-d");
      if (ch) row.append(ch);
      stats.append(row);
    };
    stat("mean", cur.mean, meanPts, "oi-mean");
    stat("median", cur.median, medPts, "oi-med");
    // The tail number, in the open: it explains a mean running well above its median.
    if (cur.oldest != null) stats.append(el("div", "oi-tail", "oldest " + fmtD(cur.oldest)));
    ages.append(stats);
    ages.append(el("div", "oi-cap", "age in days · each trend on its own scale"));
    band.append(ages);
  }
  box.append(band);
}

// Parse the append-only human-queue-history.jsonl rollup (one {ts, counts[, ages]} per
// refresh) into [{t:ms, counts[, ages]}] sorted oldest→newest, dropping malformed lines and
// any with an unparseable timestamp. Timestamps are the tool's real refresh/commit times —
// never synthesized here; this only reads them. Kept top-level (not closed over renderKpis)
// so the render can be tested against a plain fixture array.
//
// `ages` (rain-org-health#140) is OPTIONAL per line — every rollup written before the tool
// emitted it lacks the key, and a refresh whose coverage read failed omits it (along with
// `counts.openIssues`) rather than reporting a zero-sized, zero-aged population. It rides
// through only as a well-formed object; a point without one simply has no `ages` key, which
// is the absence `ageSeries` degrades on. A malformed `ages` never invalidates the line's
// counts: the count series is not hostage to the age block.
function parseHistory(text) {
  if (typeof text !== "string" || !text) return [];
  const out = [];
  for (const line of text.split("\n")) {
    const s = line.trim();
    if (!s) continue;
    let o;
    try { o = JSON.parse(s); } catch { continue; }
    if (!o || typeof o !== "object" || !o.counts || typeof o.counts !== "object") continue;
    const t = Date.parse(o.ts);
    if (!Number.isFinite(t)) continue;
    const pt = { t, counts: o.counts };
    if (o.ages && typeof o.ages === "object") pt.ages = o.ages;
    out.push(pt);
  }
  out.sort((a, b) => a.t - b.t);
  return out;
}

// The top WORKLIST_SIZE rows of `issueWorklist`, in the order the tool ranked them: issues an
// open PR claims first, then the rest, oldest first within each. Closing any one lowers the
// open count by one; the oldest moves the mean age most. The ranking is the tool's; this only
// cuts it. Rows are untrusted, so a link is drawn only for an https://github.com/ url.
const WORKLIST_SIZE = 20;
function renderWorklist(hq, nowMs) {
  const box = $("worklist");
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const gh = (u) => typeof u === "string" && u.startsWith("https://github.com/");
  const linkOrText = (cls, text, href) => {
    if (!gh(href)) return el("span", cls, text);
    const a = el("a", cls, text);
    a.href = href;
    a.rel = "noopener";
    a.target = "_blank";
    return a;
  };
  box.textContent = "";
  const rows = hq && Array.isArray(hq.issueWorklist) ? hq.issueWorklist : null;
  if (!rows) {
    box.append(el("div", "empty", "No worklist: human-queue.json carries no issueWorklist yet."));
    return;
  }
  const claimed = rows.filter((r) => r && Array.isArray(r.prs) && r.prs.length > 0).length;
  const top = rows.slice(0, WORKLIST_SIZE);
  box.append(el(
    "div",
    "wl-sum",
    `Top ${top.length} of ${rows.length} open issues · ${claimed} have an open PR (ranked first) · oldest first within each`,
  ));
  if (top.length === 0) {
    box.append(el("div", "empty", "No open issues."));
    return;
  }
  const list = el("div", "wl");
  for (const r of top) {
    const row = el("div", "wl-row");
    // The snapshot carries the creation time, not an age, so the age is as of this page load.
    const age = typeof r.createdAtMs === "number" && Number.isFinite(r.createdAtMs)
      ? `${Math.max(0, Math.round((nowMs - r.createdAtMs) / 86_400_000))}d`
      : "age ?";
    row.append(el("span", "wl-age", age));
    const main = el("span", "wl-main");
    main.append(el("span", "wl-ref", `${r.repo}#${r.number}`));
    main.append(linkOrText("wl-title", String(r.title ?? ""), r.url));
    row.append(main);
    const prs = el("span", "wl-prs");
    const urls = Array.isArray(r.prs) ? r.prs : [];
    if (urls.length === 0) prs.append(el("span", "wl-none", "no PR"));
    for (const u of urls) {
      const m = typeof u === "string" ? /\/pull\/(\d+)$/.exec(u) : null;
      prs.append(linkOrText("wl-pr", m ? `PR #${m[1]}` : "PR", u));
    }
    row.append(prs);
    list.append(row);
  }
  box.append(list);
}

// The issue snapshot is issue-pr-cron's OWN artifact, fetched at runtime — never baked into
// this repo or computed here (CLAUDE.md: the dashboard is a consumer, not a producer, of
// data). The history rollup is a second artifact fetched the same way; if it is missing the
// KPIs simply render without trend charts.
const HQ_URL = "https://raw.githubusercontent.com/rainlanguage/issue-pr-cron/main/human-queue.json";
const HIST_URL = "https://raw.githubusercontent.com/rainlanguage/issue-pr-cron/main/human-queue-history.jsonl";
$("meta").textContent = "open issues · issue-pr-cron";
Promise.all([
  fetch(HQ_URL, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
  fetch(HIST_URL, { cache: "no-store" }).then((r) => (r.ok ? r.text() : "")).catch(() => ""),
]).then(([hq, histText]) => {
  renderKpis(hq, parseHistory(histText));
  renderWorklist(hq, Date.now());
});
</script>
</body>
</html>
