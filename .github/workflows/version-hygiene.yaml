name: version hygiene
on:
  pull_request:
permissions:
  contents: read
jobs:
  version-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The marketplace listing is the only published version pointer (this repo
      # tags no releases), so it must name the same version as the plugin it
      # serves. Skew here silently publishes the wrong version to installers —
      # adversarial-mutation-test once advertised 0.26.0 while its plugin.json
      # already said 0.27.0.
      #
      # Each entry's manifest is located through that entry's own `source`, not a
      # hardcoded root path: this repo publishes from ./plugins/rain-org-health-check,
      # and reading a plugin.json that is not there would report agreement the
      # check never established. Every entry is checked and an empty listing is an
      # error, so the gate cannot pass by having looked at nothing.
      - name: every marketplace entry names the version of the plugin it serves
        run: |
          set -euo pipefail
          market=.claude-plugin/marketplace.json
          count=$(jq '.plugins | length' "$market")
          if [ "$count" -eq 0 ]; then
            echo "::error::$market lists no plugins, so no version was checked. A marketplace that publishes nothing is not a passing state."
            exit 1
          fi
          status=0
          for i in $(seq 0 "$((count - 1))"); do
            name=$(jq -r --argjson i "$i" '.plugins[$i].name // "<unnamed>"' "$market")
            listed=$(jq -r --argjson i "$i" '.plugins[$i].version // ""' "$market")
            source_type=$(jq -r --argjson i "$i" '.plugins[$i].source | type' "$market")
            if [ "$source_type" != "string" ]; then
              echo "::error::$market entry '$name' has a source of type $source_type, not a path in this repo, so the plugin it serves cannot be read here."
              status=1
              continue
            fi
            source=$(jq -r --argjson i "$i" '.plugins[$i].source' "$market")
            dir=${source%/}
            manifest="${dir:-.}/.claude-plugin/plugin.json"
            if [ ! -f "$manifest" ]; then
              echo "::error::$market entry '$name' publishes from '$source', but $manifest does not exist — nothing was compared. Fix the source or add the manifest."
              status=1
              continue
            fi
            actual=$(jq -r '.version // ""' "$manifest")
            if [ -z "$actual" ]; then
              echo "::error::$manifest names no version, so entry '$name' has nothing to agree with. Give the plugin a version."
              status=1
              continue
            fi
            if [ -z "$listed" ]; then
              echo "::error::$market entry '$name' names no version, while $manifest says $actual. The listing is what installers read — add \"version\": \"$actual\" to it."
              status=1
              continue
            fi
            if [ "$listed" != "$actual" ]; then
              echo "::error::$market entry '$name' advertises $listed but $manifest says $actual. A published listing must match the plugin it serves — bump both together."
              status=1
              continue
            fi
            echo "$name: versions agree ($actual)"
          done
          exit "$status"
