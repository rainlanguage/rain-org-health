name: scan
# Scheduled org scan: regenerate site/health.json so the dashboard stays fresh WITHOUT
# any PR ever running the scan. PRs only change code/rendering; this keeps the data current.
on:
  schedule:
    - cron: "17 * * * *" # hourly at :17 (offset off :00 to avoid clustering with other crons)
  workflow_dispatch: {}
permissions:
  contents: write # commit the regenerated health.json back to the default branch
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          checkout: 'false'
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Regenerate site/health.json
        env:
          # github.token reads the org's PUBLIC repos + search. Set a SCAN_TOKEN secret
          # (PAT with org read) only if private repos must be scanned.
          GH_TOKEN: ${{ secrets.SCAN_TOKEN || github.token }}
          ORGS: "rainlanguage cyclofinance S01-Issuer ST0x-Technology"
        run: nix run .#roh-scan
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain site/health.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # health.json is wholly generated and this run holds the newest scan,
            # so a race is resolved by REPLAYING this file onto whatever landed,
            # never by merging. Two scans rewrite the same lines of one JSON blob,
            # so a rebase conflicts on contents it makes no sense to combine — and
            # a rebase left mid-conflict makes every later `git pull` in the loop
            # fail on unmerged files, which is how a retry loop meant to absorb the
            # race became the thing that failed the scan.
            cp site/health.json "${RUNNER_TEMP}/health.json"
            for attempt in 1 2 3 4 5; do
              git add site/health.json
              git commit -m "chore(scan): refresh site/health.json"
              if git push; then
                exit 0
              fi
              echo "push race (attempt ${attempt}/5) — replaying onto ${GITHUB_REF_NAME}, retrying…"
              git fetch origin "${GITHUB_REF_NAME}"
              git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
              cp "${RUNNER_TEMP}/health.json" site/health.json
              if [ -z "$(git status --porcelain site/health.json)" ]; then
                echo "a concurrent scan pushed identical data — nothing left to push"
                exit 0
              fi
              sleep 3
            done
            echo "::error::could not push refreshed health.json after 5 attempts"
            exit 1
          else
            echo "site/health.json unchanged — nothing to commit"
          fi
