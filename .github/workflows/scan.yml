name: scan
# Scheduled org scan: regenerate site/health.json so the dashboard stays fresh WITHOUT
# any PR ever running the scan. PRs only change code/rendering; this keeps the data current.
on:
  schedule:
    - cron: "17 * * * *" # hourly at :17 (offset off :00 to avoid clustering with other crons)
  workflow_dispatch: {}
permissions:
  contents: write # commit the regenerated health.json back to the default branch
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default branch ruleset rejects a GITHUB_TOKEN push; deploy keys bypass it.
          ssh-key: ${{ secrets.SCAN_DEPLOY_KEY }}
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          checkout: 'false'
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Regenerate site/health.json
        env:
          # github.token reads the org's PUBLIC repos + search. Set a SCAN_TOKEN secret
          # (PAT with org read) only if private repos must be scanned.
          GH_TOKEN: ${{ secrets.SCAN_TOKEN || github.token }}
          ORGS: "rainlanguage cyclofinance S01-Issuer ST0x-Technology"
        run: nix run .#roh-scan
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain site/health.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp site/health.json "$RUNNER_TEMP/health.json"
            # A queued scan checks out the SHA it was triggered at, so master can
            # already hold a newer refresh: commit this scan's file onto the latest
            # master each attempt instead of rebasing a commit that conflicts.
            for attempt in 1 2 3 4 5; do
              git fetch -q origin "${GITHUB_REF_NAME}"
              git checkout -q -f -B scan-refresh "origin/${GITHUB_REF_NAME}"
              cp "$RUNNER_TEMP/health.json" site/health.json
              git add site/health.json
              if git diff --cached --quiet; then
                echo "site/health.json unchanged against master — nothing to commit"
                exit 0
              fi
              # A deploy-key push fires `push` workflows, which a GITHUB_TOKEN push
              # never did; [skip ci] keeps the hourly refresh from running them.
              git commit -q -m "chore(scan): refresh site/health.json [skip ci]"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "push race (attempt ${attempt}/5) — retrying on the latest master…"
              sleep 3
            done
            echo "::error::could not push refreshed health.json after 5 attempts"
            exit 1
          else
            echo "site/health.json unchanged — nothing to commit"
          fi
